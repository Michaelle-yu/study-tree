  form.append(noteInput);

  drawer.append(form);

  drawer.append(h('label', { text: `照片（${(node.photos || []).length}/3）` }));
  const grid = h('div', { class: 'photo-grid' });
  for (const p of node.photos || []) {
    const item = h('div', { class: 'photo-item' });
    item.append(h('img', { src: `/api/photos/${encodeURIComponent(p.storedAs)}`, alt: p.name, loading: 'lazy' }));
    item.append(h('button', { class: 'x', type: 'button', text: '×', title: '删除照片', onclick: async () => {
      try {
        await api(`/api/photos/${encodeURIComponent(p.storedAs)}`, { method: 'DELETE' });
        toast('照片已删除', 'ok');
        await loadTree();
        openDrawer(node.id);
      } catch (e) { handleApiError(e); }
    } }));
    grid.append(item);
  }
  drawer.append(grid);
  if ((node.photos || []).length < 3) {
    const fileInput = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp,image/gif' });
    fileInput.style.marginTop = '6px';
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      if (file.size > 8 * 1024 * 1024) { toast('图片不能超过 8MB', 'error'); return; }
      try {
        setSync('上传中…');
        const res = await fetch(`/api/photos?nodeId=${encodeURIComponent(node.id)}&name=${encodeURIComponent(file.name)}`, {
          method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': file.type || 'application/octet-stream' }, body: file,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || '上传失败');
        setSync('已保存');
        toast('照片已上传', 'ok');
        await loadTree();
        openDrawer(node.id);
      } catch (e) { setSync(''); handleApiError(e); }
    });
    drawer.append(fileInput);
  }

  if (node.kind === 'leaf') {
    const available = Number(app.meta.available) || 0;
    if (node.unlocked) {
      drawer.append(h('div', { class: 'hint-line', text: `已点亮 · 累计获得经验 ${node.cost * 10}（每周上限 1500）` }));
    } else {
      const affordable = available + 1e-9 >= node.cost;
      const unlockBtn = h('button', {
        class: 'primary wide', type: 'button', text: `点亮（消耗 ${node.cost} 科技点）`,
        disabled: !affordable,
        title: affordable ? '' : `科技点不足，还差 ${fmtNum(Math.max(0, node.cost - available))}`,
      });
      unlockBtn.addEventListener('click', async () => {
        node.unlocked = true;
        const ok = await persistTree();
        if (ok) toast(`「${node.name}」已点亮`, 'ok');
      });
      form.append(h('div', { class: 'hint-line', text: affordable ? `可用 ${fmtNum(available)} 点，点亮后剩余 ${fmtNum(available - node.cost)} 点。` : `可用 ${fmtNum(available)} 点，还差 ${fmtNum(node.cost - available)} 点。` }));
      form.append(h('div', { class: 'drawer-actions wide' }, unlockBtn));
    }
  }

  if (node.kind === 'group') {
    const leaves = app.tree.abilities.filter(a => a.kind === 'leaf' && a.parentId === node.id);
    drawer.append(h('label', { text: `包含知识点（${leaves.length}）` }));
    if (leaves.length) {
      const list = h('div', { class: 'tt-list' });
      for (const leaf of leaves) {
        const row = h('div', { class: 'tt-list-row', onclick: () => openDrawer(leaf.id) });
        row.append(h('span', { text: leaf.unlocked ? '●' : '○' }));
        row.append(h('span', { class: 'nm', text: leaf.name }));
        row.append(h('span', { class: 'cnt', text: String(leaf.cost) }));
        list.append(row);
      }
      drawer.append(list);
    } else {
      drawer.append(h('div', { class: 'hint-line', text: '暂无知识点，可从左侧「＋ 知识点」添加。' }));
    }
  }

  const actions = h('div', { class: 'drawer-actions' });
  const saveBtn = h('button', { class: 'primary wide', type: 'submit', text: '保存修改' });
  form.append(actions);
  actions.append(saveBtn);
  actions.append(h('button', { class: 'danger', type: 'button', text: '删除节点', onclick: async () => {
    const label = node.kind === 'group' ? `删除能力组「${node.name}」及其所有知识点？` : `删除知识点「${node.name}」？`;
    if (!(await confirmDialog(label, '删除'))) return;
    const ids = new Set([node.id]);
    if (node.kind === 'group') for (const a of app.tree.abilities) if (a.parentId === node.id) ids.add(a.id);
    app.tree.abilities = app.tree.abilities.filter(a => !ids.has(a.id));
    for (const a of app.tree.abilities) a.prereqIds = (a.prereqIds || []).filter(id => !ids.has(id));
    closeDrawer();
    const ok = await persistTree();
    if (ok) toast('已删除', 'ok');
  } }));

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const name = nameInput.value.trim();
    if (!name) { toast('名称不能为空', 'error'); return; }
    if (name.length > 40) { toast('名称最多 40 个字符', 'error'); return; }
    node.name = name;
    if (node.kind === 'leaf') {
      const cost = Math.round(Number(costInput.value));
      if (!Number.isInteger(cost) || cost < 1 || cost > 100000) { toast('成本需为 1–100000 的整数', 'error'); return; }
      node.cost = cost;
      node.prereqIds = [...prereqSet];
    } else {
      node.categoryId = catSelect.value;
    }
    node.note = noteInput.value.slice(0, 5000);
    const ok = await persistTree();
    if (ok) toast('已保存', 'ok');
  });
}

// ---------------------------------------------------------------- 新建节点
function openNodeModal(kind = 'leaf', preset = {}) {
  if (app.readOnly) return;
  let currentKind = kind;
  const groups = app.tree.abilities.filter(a => a.kind === 'group');
  if (currentKind === 'leaf' && !groups.length) {
    toast('请先创建一个能力组', 'error');
    currentKind = 'group';
  }
  const name = h('input', { maxlength: 40, placeholder: currentKind === 'group' ? '例如：前端开发' : '例如：JavaScript 基础' });
  const kindSelect = h('select', {},
    h('option', { value: 'group', text: '能力组（无父节点，带分类）', selected: currentKind === 'group' }),
    h('option', { value: 'leaf', text: '知识点（挂在能力组下）', selected: currentKind === 'leaf' })
  );
  const cost = h('input', { type: 'number', min: 1, max: 100000, step: 1, value: preset.mastered ? 1 : 3 });
  const parent = h('select', {});
  groups.forEach(g => parent.append(h('option', { value: g.id, text: g.name, selected: preset.parentId === g.id })));
  const category = h('select', {});
  app.tree.categories.forEach(c => category.append(h('option', { value: c.id, text: c.name, selected: (preset.categoryId || c.id) === c.id })));
  const mastered = h('input', { type: 'checkbox', checked: !!preset.mastered });
  mastered.style.width = 'auto';
  const prereqBox = h('div', {});
  const prereqSet = new Set();
  const catBlock = h('div', {}, h('label', { text: '所属分类' }), category);
  const leafBlock = h('div', {},
    h('label', { text: '父能力组' }), parent,
    h('label', { text: '成本（科技点）' }), cost,
    h('label', { class: 'row' }, mastered, h('span', { text: '新增已掌握（直接点亮，不扣科技点）' })),
    h('label', { text: '前置知识点（可选，必须已点亮）' }), prereqBox
  );
  function renderPrereqs() {
    prereqBox.replaceChildren();
    const gid = parent.value;
    const siblings = app.tree.abilities.filter(a => a.kind === 'leaf' && a.parentId === gid);
    if (!siblings.length) { prereqBox.append(h('div', { class: 'hint-line', text: '该组还没有其他知识点。' })); return; }
    const chips = h('div', { class: 'chips' });
    for (const s of siblings) {
      const chip = h('button', { class: 'chip', type: 'button', text: `${s.name}${s.unlocked ? ' ✓' : ' (未点亮)'}` });
      chip.addEventListener('click', () => {
        if (prereqSet.has(s.id)) prereqSet.delete(s.id);
        else { if (prereqSet.size >= 8) { toast('最多 8 个前置', 'error'); return; } prereqSet.add(s.id); }
        chip.classList.toggle('on', prereqSet.has(s.id));
      });
      chips.append(chip);
    }
    prereqBox.append(chips);
  }
  function syncKind() {
    currentKind = kindSelect.value;
    catBlock.hidden = currentKind !== 'group';
    leafBlock.hidden = currentKind !== 'leaf';
    if (currentKind === 'leaf' && !groups.length) { toast('请先创建能力组', 'error'); kindSelect.value = 'group'; syncKind(); return; }
    if (currentKind === 'leaf') renderPrereqs();
  }
  kindSelect.addEventListener('change', syncKind);
  parent.addEventListener('change', renderPrereqs);

  const content = h('div', {}, h('label', { text: '节点类型' }), kindSelect, h('label', { text: '名称' }), name, catBlock, leafBlock,
    h('div', { class: 'hint-line', text: '能力组成本自动等于其下知识点成本之和；能力组需要选择分类。' }));
  if (currentKind === 'leaf') renderPrereqs();
  catBlock.hidden = currentKind !== 'group';
  leafBlock.hidden = currentKind !== 'leaf';

  const modal = openModal('新建节点', content, [
    { label: '取消', onClick: () => modal.close() },
    { label: '创建', primary: true, onClick: async () => {
      const value = name.value.trim();
      if (!value) { toast('名称不能为空', 'error'); return; }
      if (value.length > 40) { toast('名称最多 40 个字符', 'error'); return; }
      const k = kindSelect.value;
      const node = {
        id: uuid(), name: value, cost: 1, unlocked: false, kind: k,
        parentId: k === 'leaf' ? parent.value : null,
        prereqIds: k === 'leaf' ? [...prereqSet] : [],
        categoryId: k === 'group' ? category.value : null,
        ox: 0, oy: app.tree.abilities.length * 10, note: '', photos: [],
      };
      if (k === 'leaf') {
        node.cost = Math.round(Number(cost.value));
        if (!Number.isInteger(node.cost) || node.cost < 1 || node.cost > 100000) { toast('成本需为 1–100000 的整数', 'error'); return; }
        node.unlocked = mastered.checked;
      }
      app.tree.abilities.push(node);
      modal.close();
      const ok = await persistTree();
      if (ok) toast('已创建', 'ok');
    } },
  ]);
}

// ---------------------------------------------------------------- 课表
function ttTable() {
  if (!app.tree) return { courses: [], plans: [] };
  const key = app.tree.week.key;
  if (!app.tree.timer.weeks[key]) app.tree.timer.weeks[key] = { courses: [], plans: [] };
  return app.tree.timer.weeks[key];
}

function renderTimetable() {
  const view = $('#timetableView');
  if (!view || !app.tree) return;
  const scrollTop = (view.querySelector('.tt-scroll') || {}).scrollTop || 0;
  view.replaceChildren();
  const table = ttTable();
  const meta = app.meta || { available: 0, remainingMinutes: 0, rate: 0, bonus: 0, used: 0 };
  const top = h('div', { class: 'tt-top' },
    h('h1', { text: '本周课表' }),
    h('span', { class: 'pill', text: app.tree.week.key }),
    h('span', { class: 'muted', text: app.readOnly ? '只读查看' : '课程实色 / 安排虚线 / 课间紧凑带' }),
    h('span', { class: 'grow' })
  );
  if (!app.readOnly) {
    top.append(h('button', { class: 'primary', type: 'button', text: '＋ 课程', onclick: () => openCourseModal('course') }));
    top.append(h('button', { type: 'button', text: '＋ 日常安排', onclick: () => openCourseModal('plan') }));
  }
  const scroll = h('div', { class: 'tt-scroll' });
  const inner = h('div', { class: 'tt-inner' });
  const grid = h('div', { class: 'tt-table' });
  grid.append(h('div', { class: 'tt-corner', text: '时间' }));
  for (let d = 1; d <= 7; d++) grid.append(h('div', { class: 'tt-dayhead', text: dayName(d) }));
  const axis = h('div', { class: 'tt-axis' });
  for (let m = 480; m <= 1320; m += 60) {
    const label = h('span', { text: minToTime(m) });
    label.style.top = (m - 480) + 'px';
    axis.append(label);
  }
  grid.append(axis);

  const selectedKey = app.ttSelected;
  const occurrences = [];
  for (const c of table.courses) occurrences.push({ kind: 'course', id: c.id, day: c.day, start: timeToMin(c.start), end: timeToMin(c.end), title: c.title, raw: c });
  for (const p of table.plans) for (const d of p.days) occurrences.push({ kind: 'plan', id: p.id, day: d, start: timeToMin(p.start), end: timeToMin(p.end), title: p.title, break: !!p.break, raw: p });
  for (let d = 1; d <= 7; d++) {
    const col = h('div', { class: 'tt-col' });
    const dayItems = occurrences.filter(o => o.day === d && o.start !== null && o.end !== null).sort((a, b) => a.start - b.start || b.end - a.end);
    const laneEnds = [];
    const placed = [];
    for (const item of dayItems) {
      let lane = laneEnds.findIndex(end => end <= item.start);
      if (lane < 0) { lane = laneEnds.length; laneEnds.push(item.end); }
      else laneEnds[lane] = item.end;
      placed.push({ ...item, lane });
    }
    const lanes = Math.max(1, laneEnds.length);
    for (const item of placed) {
      const key = `${item.kind}:${item.id}:${item.day}`;
      const card = h('div', {
        class: 'tt-card ' + item.kind + (item.break ? ' break' : '') + (selectedKey === key ? ' selected' : '') + (app.ttHighlight && item.title === app.ttHighlight ? ' highlight' : ''),
        title: `${item.title} ${minToTime(item.start)}–${minToTime(item.end)}`,
      });
      card.dataset.key = key;
      card.style.left = (item.lane * (100 / lanes)) + '%';
      card.style.width = `calc(${100 / lanes}% - 3px)`;
      card.style.top = (item.start - 480) + 'px';
      card.style.height = Math.max(20, item.end - item.start) + 'px';
      card.append(h('div', { class: 't-title', text: item.title }));
      if (!item.break) card.append(h('div', { class: 't-time', text: `${minToTime(item.start)}–${minToTime(item.end)}` }));
      card.addEventListener('click', e => onTtCardClick(e, item));
      if (selectedKey === key && !app.readOnly) {
        card.append(h('button', { class: 't-del', type: 'button', text: '✕', title: '删除这一格', onclick: e => { e.stopPropagation(); deleteOccurrence(item); } }));
      }
      col.append(card);
    }
    grid.append(col);
  }
  inner.append(grid);
  const nowLine = h('div', { class: 'tt-nowline', id: 'ttNowLine' });
  const petCanvas = h('canvas', { id: 'petCanvas', class: 'tt-pet', width: 32, height: 32 });
  nowLine.append(petCanvas);
  nowLine.append(h('span', { class: 'now-label', text: '现在' }));
  inner.append(nowLine);
  scroll.append(inner);
  scroll.scrollTop = scrollTop;

  const side = h('div', { class: 'tt-side' });
  side.append(buildTtStats(meta));
  side.append(buildTtScheduleList(table));
  side.append(buildTtTasks());

  const shell = h('div', { class: 'tt-shell' }, h('div', { class: 'panel tt-panel' }, top, scroll), side);
  view.append(shell);
  updateNowLine();
  startTtTimers();
}

function buildTtStats(meta) {
  const box = h('div', { class: 'panel tt-box' });
  box.append(h('h3', {}, h('span', { text: '科技点换算' }), h('span', { class: 'pill', text: app.readOnly ? '只读' : '本周' })));
  const rateRow = h('div', { class: 'rate-row' });
  const slider = h('input', { type: 'range', min: 0, max: 100, step: 1, value: String(meta.rate || 0) });
  slider.disabled = app.readOnly;
  const rateLabel = h('span', { class: 'mono', text: `${meta.rate || 0}%` });
  slider.addEventListener('input', () => {
    rateLabel.textContent = slider.value + '%';
    app.tree.timer.rate = Number(slider.value);
    clearTimeout(app.rateTimer);
    app.rateTimer = setTimeout(async () => {
      const ok = await persistTree({ render: false });
      if (ok) renderTimetable();
    }, 350);
  });
  rateRow.append(slider, rateLabel);
  box.append(rateRow);
  box.append(h('div', { class: 'formula', text:
    `本周总空闲 ${Math.round(meta.totalFreeMinutes / 60 * 10) / 10}h\n` +
    `剩余空闲 ${Math.round(meta.remainingMinutes / 60 * 10) / 10}h × ${meta.rate}% = ${fmtNum((meta.remainingMinutes / 60) * meta.rate / 100)}\n` +
    `任务奖励 +${meta.bonus} · 已用 −${meta.used}\n` +
    `可用 = ${fmtNum(meta.available)} 科技点` }));
  return box;
}

function buildTtScheduleList(table) {
  const box = h('div', { class: 'panel tt-box' });
  box.append(h('h3', {}, h('span', { text: '本周安排' }), h('span', { class: 'muted', text: '点击高亮 · 可整条删除' })));
  const courses = new Map();
  for (const c of table.courses) {
    if (!courses.has(c.title)) courses.set(c.title, { kind: 'course', title: c.title, count: 0 });
    courses.get(c.title).count++;
  }
  const plans = new Map();
  for (const p of table.plans) {
    if (!plans.has(p.title)) plans.set(p.title, { kind: 'plan', title: p.title, count: 0 });
    plans.get(p.title).count += p.days.length;
  }
  const list = h('div', { class: 'tt-list' });
  for (const item of [...courses.values(), ...plans.values()]) {
    const row = h('div', { class: 'tt-list-row' + (app.ttHighlight === item.title ? ' hl' : '') });
    row.append(h('span', { text: item.kind === 'course' ? '■' : '▢' }));
    row.append(h('span', { class: 'nm', text: item.title }));
    row.append(h('span', { class: 'cnt', text: `${item.count}${item.kind === 'course' ? ' 节' : ' 天'}` }));
    row.title = '点击高亮相同名称的卡片';
    row.addEventListener('click', () => {
      app.ttHighlight = app.ttHighlight === item.title ? '' : item.title;
      renderTimetable();
    });
    if (!app.readOnly) {
      row.append(h('button', { class: 'mini danger', type: 'button', text: '删除', title: '删除整条', onclick: async e => {
        e.stopPropagation();
        if (!(await confirmDialog(`删除所有「${item.title}」${item.kind === 'course' ? '课程' : '安排'}？`, '删除'))) return;
        if (item.kind === 'course') table.courses = table.courses.filter(c => c.title !== item.title);
        else table.plans = table.plans.filter(p => p.title !== item.title);
        await persistTree({ render: false });
        renderTimetable();
      } }));
    }
    list.append(row);
  }
  if (!list.children.length) list.append(h('div', { class: 'empty', text: '本周还没有安排。' }));
  box.append(list);
  box.append(h('div', { class: 'row' }, h('span', { class: 'muted', text: '课间带不计入空闲。' })));
  const petRow = h('div', { class: 'row' });
  const petSelect = h('select', { class: 'pet-select' });
  for (const [id, label] of [['cat', '猫'], ['dog', '狗'], ['rabbit', '兔'], ['penguin', '企鹅']]) {
    petSelect.append(h('option', { value: id, text: label, selected: app.pet === id }));
  }
  petSelect.addEventListener('change', () => {
    app.pet = petSelect.value;
    localStorage.setItem('pet', app.pet);
    petFrames.delete(app.pet);
    startPetAnimation();
  });
  petRow.append(h('span', { class: 'muted', text: '走动角色：' }), petSelect);
  box.append(petRow);
  return box;
}

function buildTtTasks() {
  const box = h('div', { class: 'panel tt-box' });
  const meta = { bonus: app.meta ? app.meta.bonus : 0 };
  box.append(h('h3', {}, h('span', { text: '本周任务' }), h('span', { class: 'pill warn', text: `奖励 +${meta.bonus}` })));
  const list = h('div', {});
  for (const task of app.tree.tasks) {
    const row = h('div', { class: 'task-row' });
    const cb = h('input', { type: 'checkbox', checked: task.done });
    cb.disabled = app.readOnly;
    cb.addEventListener('change', async () => {
      task.done = cb.checked;
      task.doneAt = cb.checked ? new Date().toISOString() : null;
      await persistTree({ render: false });
      renderTimetable();
    });
    row.append(cb);
    row.append(h('span', { class: 'tm', text: task.name }));
    row.append(h('span', { class: 'tp', text: `+${task.points}` }));
    if (!app.readOnly) row.append(h('button', { class: 'mini ghost', type: 'button', text: '×', onclick: async () => {
      app.tree.tasks = app.tree.tasks.filter(t => t.id !== task.id);
      await persistTree({ render: false });
      renderTimetable();
    } }));
    list.append(row);
  }
  if (!app.tree.tasks.length) list.append(h('div', { class: 'empty', text: '完成任务可获得科技点奖励。' }));
  box.append(list);
  if (!app.readOnly) {
    const name = h('input', { placeholder: '任务名称', maxlength: 40 });
    const pts = h('input', { type: 'number', min: 0, max: 1000, step: 1, value: 1 });
    pts.style.width = '74px';
    const add = h('button', { class: 'mini', type: 'button', text: '添加', onclick: async () => {
      const value = name.value.trim();
      if (!value) { toast('任务名称不能为空', 'error'); return; }
      app.tree.tasks.push({ id: uuid(), name: value, points: Math.round(Number(pts.value) || 0), done: false, doneAt: null });
      await persistTree({ render: false });
      renderTimetable();
    } });
    box.append(h('div', { class: 'row' }, name, pts, add));
  }
  return box;
}

function onTtCardClick(event, item) {
  const key = `${item.kind}:${item.id}:${item.day}`;
  if (event.ctrlKey || event.metaKey) {
    if (!app.ttCtrl || app.ttCtrl.day !== item.day || app.ttCtrl.key === key) {
      app.ttCtrl = { ...item, key };
      app.ttSelected = key;
      renderTimetable();
      toast('再 Ctrl+点击同一天的另一张卡，可插入课间', 'ok');
      return;
    }
    const first = app.ttCtrl.start <= item.start ? app.ttCtrl : item;
    const second = app.ttCtrl.start <= item.start ? item : app.ttCtrl;
    const gapStart = first.end;
    const gapEnd = second.start;
    app.ttCtrl = null;
    if (gapEnd <= gapStart) { toast('两张卡之间没有空隙，无法插入课间', 'error'); return; }
    if (app.readOnly) return;
    const table = ttTable();
    table.plans.push({ id: uuid(), days: [item.day], start: minToTime(gapStart), end: minToTime(gapEnd), title: '课间', break: true });
    persistTree({ render: false }).then(ok => { if (ok) { toast('已插入课间（不算空闲）', 'ok'); renderTimetable(); } });

const petFrames = new Map();
function getPetFrames(type) {
  if (petFrames.has(type)) return petFrames.get(type);
  const colors = { cat: '#f3b26a', dog: '#d9a06a', rabbit: '#e9e2d8', penguin: '#88dcec' };
  const frames = [];
  for (let f = 0; f < 8; f++) {
    const canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const step = [0, 1, 2, 3, 0, 1, 2, 3][f];
    const bob = f < 4 ? 0 : 1;
    const color = colors[type] || colors.cat;
    ctx.fillStyle = color;
    ctx.fillRect(8, 13 + bob, 16, 12);
    ctx.fillRect(10, 8 + bob, 12, 9);
    if (type === 'cat') { ctx.fillRect(10, 5 + bob, 4, 4); ctx.fillRect(18, 5 + bob, 4, 4); }
    if (type === 'dog') { ctx.fillRect(9, 8 + bob, 4, 6); ctx.fillRect(19, 8 + bob, 4, 6); }
    if (type === 'rabbit') { ctx.fillRect(11, 1 + bob, 3, 8); ctx.fillRect(18, 1 + bob, 3, 8); }
    if (type === 'penguin') { ctx.fillStyle = '#12303d'; ctx.fillRect(8, 12 + bob, 3, 10); ctx.fillRect(21, 12 + bob, 3, 10); ctx.fillStyle = color; }
    ctx.fillStyle = '#0b0f14';
    ctx.fillRect(12, 11 + bob, 2, 2);
    ctx.fillRect(18, 11 + bob, 2, 2);
    ctx.fillStyle = color;
    ctx.fillRect(10, 24 + step, 3, 4);
    ctx.fillRect(19, 24 - step, 3, 4);
    ctx.fillRect(24, 15 - step + bob, 4, 3);
    frames.push(canvas);
  }
  petFrames.set(type, frames);
  return frames;
}

let petFrameIndex = 0;
function startPetAnimation() {
  clearInterval(app.ttPetTimer);
  app.ttPetTimer = setInterval(() => {
    if (app.view !== 'timetable') return;
    const canvas = $('#petCanvas');
    const line = $('#ttNowLine');
    if (!canvas || !line || line.hidden) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, 32, 32);
    const frames = getPetFrames(app.pet);
    ctx.drawImage(frames[petFrameIndex % 8], 0, 0);
    petFrameIndex++;
  }, 130);
}

function startTtTimers() {

async function loadLocalNotes() {
  app.notes.localList = [];
  if (!window.showDirectoryPicker) return;
  try {
    let handle = await idbGet('notesDir');
    if (!handle) return;
    if (handle.queryPermission) {
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') {
        const req = await handle.requestPermission({ mode: 'readwrite' });
        if (req !== 'granted') return;
      }
    }
    app.notes.dir = handle;
    for await (const [name, entry] of handle.entries()) {
      if (name.toLowerCase().endsWith('.md')) app.notes.localList.push({ name, handle: entry });
    }
    app.notes.localList.sort((a, b) => a.name.localeCompare(b.name));
  } catch (e) {
    app.notes.dir = null;
  }
}

function mdToHtml(source) {
  const escape = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const inline = raw => {
    let s = escape(raw);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer noopener">$1</a>');
    return s;
  };
  const lines = String(source || '').split(/\r?\n/);
  const out = [];
  let inCode = false;
  let code = [];
  let list = false;
  const closeList = () => { if (list) { out.push('</ul>'); list = false; } };
  for (const line of lines) {
    if (line.trim().startsWith('```')) {
      if (inCode) { out.push(`<pre><code>${escape(code.join('\n'))}</code></pre>`); code = []; inCode = false; }
      else { closeList(); inCode = true; }
      continue;
    }
    if (inCode) { code.push(line); continue; }
    const heading = /^(#{1,3})\s+(.*)$/.exec(line);
    if (heading) { closeList(); out.push(`<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`); continue; }
    if (/^\s*[-*]\s+/.test(line)) {
      if (!list) { out.push('<ul>'); list = true; }
      out.push(`<li>${inline(line.replace(/^\s*[-*]\s+/, ''))}</li>`);
      continue;
    }
    closeList();
    if (/^>\s?/.test(line)) { out.push(`<blockquote>${inline(line.replace(/^>\s?/, ''))}</blockquote>`); continue; }
    if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { out.push('<div class="hr"></div>'); continue; }
    if (!line.trim()) continue;
    out.push(`<p>${inline(line)}</p>`);
  }
  if (inCode) out.push(`<pre><code>${escape(code.join('\n'))}</code></pre>`);
  closeList();
  return out.join('');
}

// IndexedDB
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('growth-tree', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('kv'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readonly');
    const req = tx.objectStore('kv').get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// ---------------------------------------------------------------- 蓝图
function clientScore({ title, note, nodes, images, files }) {
  const t = String(title || '').trim();
  const n = String(note || '').trim();
  const ns = nodes || [];
  let score = t.length >= 2 ? 10 : 0;
  score += Math.min(30, Math.floor(n.length / 3));
  score += Math.min(15, ns.length * 3);
  const noted = ns.filter(x => String(x.note || '').trim()).length;
  score += ns.length ? Math.round(30 * noted / ns.length) : 0;
  score += (images || []).length + (files || []).length > 0 ? 15 : 0;
  score += ns.length >= 2 && ns.length <= 30 ? 5 : 0;
  return Math.min(100, score);
}

    content.append(h('div', { class: 'kv' },

function openChat(friend) {
  const list = h('div', { class: 'md-preview' });
  list.style.minHeight = '280px';
  list.style.maxHeight = '420px';
  list.style.display = 'flex';
  list.style.flexDirection = 'column';
  list.style.gap = '6px';
  const text = h('input', { placeholder: '输入消息…', maxlength: 1000 });
  const send = h('button', { class: 'primary', type: 'button', text: '发送', onclick: submit });
  let timer = null;
  let lastCount = -1;

  async function load() {
    try {
      const data = await api(`/api/chat/${encodeURIComponent(friend.id)}`);
      if (data.messages.length === lastCount) return;
      lastCount = data.messages.length;
      list.replaceChildren();
      if (!data.messages.length) list.append(h('div', { class: 'empty', text: '还没有消息，打个招呼吧。' }));
      for (const m of data.messages) {
        const mine = app.me && m.from === app.me.id;
        const bubble = h('div', { text: m.text });
        bubble.style.alignSelf = mine ? 'flex-end' : 'flex-start';
        bubble.style.maxWidth = '78%';
        bubble.style.padding = '7px 10px';
        bubble.style.borderRadius = '10px';
        bubble.style.background = mine ? 'rgba(79,209,197,.16)' : 'rgba(255,255,255,.05)';
        bubble.style.border = '1px solid ' + (mine ? 'rgba(79,209,197,.35)' : 'var(--line)');
        bubble.style.whiteSpace = 'pre-wrap';
        bubble.style.wordBreak = 'break-word';
        bubble.title = fmtDate(m.at);
        list.append(bubble);
      }
      list.scrollTop = list.scrollHeight;
    } catch (e) { /* 轮询失败静默 */ }
  }
  async function submit() {
    const value = text.value.trim();
    if (!value) return;
    try {
      await api(`/api/chat/${encodeURIComponent(friend.id)}`, { method: 'POST', body: JSON.stringify({ text: value }) });
      text.value = '';
      lastCount = -1;
      await load();
    } catch (e) { handleApiError(e); }
  }
  text.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  const modal = openModal(`与 ${friend.name} 聊天`, h('div', {}, list, h('div', { class: 'row' }, text, send)), [], {
    onClose: () => clearInterval(timer),
  });
  load();
  timer = setInterval(load, 3000);
}

        } }));
        ops.append(h('button', { class: 'mini danger', type: 'button', text: '删除', onclick: async () => {
          if (!(await confirmDialog(`删除账号「${u.name}」？会级联清理其树、笔记、照片、蓝图、好友、聊天、反馈与会话。`, '删除账号'))) return;
          try { await api(`/api/admin/users/${encodeURIComponent(u.id)}`, { method: 'DELETE' }); toast('账号已删除', 'ok'); loadAdmin(); } catch (e) { handleApiError(e); }
        } }));
      }
      tr.append(ops);
      tbody.append(tr);
    }
    table.append(tbody);
    wrap.append(table);
    view.append(wrap);
  } catch (e) { handleApiError(e); }
}

async function showUserBlueprints(user) {
  try {
    const data = await api(`/api/admin/users/${encodeURIComponent(user.id)}/blueprints`);
    const content = h('div', {});
    if (!data.blueprints.length) content.append(h('div', { class: 'empty', text: '该用户暂无蓝图。' }));
    for (const bp of data.blueprints) {
      content.append(h('div', { class: 'user-row' },
        h('span', { class: 'nm', text: bp.title }),
        h('span', { class: 'pill mutedp', text: `${bp.score} 分` }),
        h('span', { class: 'pill', text: bp.visibility })
      ));
    }
    openModal(`${user.name} 的蓝图`, content, [{ label: '关闭', onClick: closeModal }]);
  } catch (e) { handleApiError(e); }
}

// ---------------------------------------------------------------- 设置
function openSettings() {
  if (!app.me) return;
  const priv = app.me.privacy || { tree: true, timer: true, bp: true };
  const treeCb = h('input', { type: 'checkbox', checked: !!priv.tree });
  const timerCb = h('input', { type: 'checkbox', checked: !!priv.timer });
  const bpCb = h('input', { type: 'checkbox', checked: !!priv.bp });
  [treeCb, timerCb, bpCb].forEach(cb => { cb.style.width = 'auto'; });
  const oldPwd = h('input', { type: 'password', autocomplete: 'current-password' });
  const newPwd = h('input', { type: 'password', autocomplete: 'new-password' });
  const importInput = h('input', { type: 'file', accept: 'application/json,.json' });
  importInput.style.display = 'none';
  importInput.addEventListener('change', async () => {
    const file = importInput.files && importInput.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const tree = JSON.parse(text);
      const data = await api('/api/import', { method: 'POST', body: JSON.stringify({ tree }) });
      app.tree = data.tree;
      app.meta = data.meta;
      updateHeader();
      renderTreeAll();
      closeModal();
      toast('导入成功', 'ok');
    } catch (e) { handleApiError(e); }
  });

  const content = h('div', {},
    h('h3', { text: '隐私' }),
    h('label', { class: 'row' }, treeCb, h('span', { text: '允许好友查看我的树' })),
    h('label', { class: 'row' }, timerCb, h('span', { text: '允许好友查看我的课表与时间' })),
    h('label', { class: 'row' }, bpCb, h('span', { text: '允许好友查看我的好友可见蓝图（关闭后仅公开蓝图可见）' })),
    h('div', { class: 'modal-foot' }, h('button', { class: 'mini primary', type: 'button', text: '保存隐私设置', onclick: async () => {
      try {
        const data = await api('/api/users/me', { method: 'PUT', body: JSON.stringify({ privacy: { tree: treeCb.checked, timer: timerCb.checked, bp: bpCb.checked } }) });
        app.me = data.user;
        toast('隐私设置已更新', 'ok');
      } catch (e) { handleApiError(e); }
    } })),
    h('div', { class: 'hr' }),
    h('h3', { text: '修改密码' }),
    h('div', { class: 'hint-line', text: '修改成功后其他设备上的会话会被注销。' }),
    h('label', { text: '当前密码' }), oldPwd,
    h('label', { text: '新密码（至少 8 位）' }), newPwd,
    h('div', { class: 'modal-foot' }, h('button', { class: 'mini primary', type: 'button', text: '更新密码', onclick: async () => {
      if (newPwd.value.length < 8) { toast('新密码至少 8 位', 'error'); return; }
      try {
        await api('/api/auth/password', { method: 'POST', body: JSON.stringify({ oldPassword: oldPwd.value, newPassword: newPwd.value }) });
        oldPwd.value = ''; newPwd.value = '';
        toast('密码已更新，其他设备已下线', 'ok');
      } catch (e) { handleApiError(e); }
    } })),
    h('div', { class: 'hr' }),
    h('h3', { text: '数据' }),
    h('div', { class: 'row' },
      h('button', { class: 'mini', type: 'button', text: '导出树 JSON', onclick: exportTree }),
      h('button', { class: 'mini', type: 'button', text: '导入树 JSON', onclick: () => importInput.click() })
    ),
    importInput,
    h('div', { class: 'hr' }),
    h('h3', { text: '账号' }),
    h('div', { class: 'kv' }, h('span', { class: 'k', text: '用户名' }), h('span', { class: 'v', text: app.me.name }), h('span', { class: 'k', text: '角色' }), h('span', { class: 'v', text: app.me.role }), h('span', { class: 'k', text: '注册' }), h('span', { class: 'v', text: fmtDate(app.me.createdAt) })),
    h('div', { class: 'modal-foot' }, h('button', { class: 'danger', type: 'button', text: '退出登录', onclick: logout }))
  );
  openModal('账号与设置', content, [{ label: '关闭', onClick: closeModal }]);
}

async function exportTree() {
  try {
    const res = await fetch('/api/export', { credentials: 'same-origin' });
    if (!res.ok) throw new Error('导出失败');
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `growth-tree-${app.me.name}.json`;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) { handleApiError(e); }
}

// ---------------------------------------------------------------- 视图切换与导航
function switchView(name) {
  app.view = name;
  document.querySelectorAll('.view').forEach(v => { v.hidden = true; });
  const target = document.getElementById(name + 'View');
  if (target) target.hidden = false;
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  if (name !== 'timetable') stopTtTimers();
  if (name === 'tree') {
    renderTreeAll();
    setTimeout(() => { renderCanvas(); updateHeader(); }, 30);
  }
  if (name === 'timetable') { renderTimetable(); updateHeader(); }
  if (name === 'notes') loadNotes();
  if (name === 'blueprints') loadBlueprints();
  if (name === 'friends') loadFriends();
  if (name === 'feedback') loadFeedback();
  if (name === 'admin') loadAdmin();
  $('#moreMenu').hidden = true;
}

function renderMoreMenu() {
  const menu = $('#moreMenu');
  menu.replaceChildren();
  const views = [['tree', '树'], ['timetable', '课表'], ['notes', '笔记'], ['blueprints', '蓝图'], ['friends', '好友'], ['feedback', '反馈']];
  if (app.me && app.me.role === 'admin') views.push(['admin', '管理']);
  for (const [id, label] of views) {
    menu.append(h('button', { type: 'button', text: label, onclick: () => switchView(id) }));
  }
  menu.append(h('button', { type: 'button', text: '设置', onclick: () => { menu.hidden = true; openSettings(); } }));
  menu.append(h('button', { type: 'button', text: '退出登录', onclick: () => { menu.hidden = true; logout(); } }));
}

// ---------------------------------------------------------------- 绑定事件
function bindEvents() {
  $('#tabLogin').addEventListener('click', () => switchAuthTab(false));
  $('#tabRegister').addEventListener('click', () => switchAuthTab(true));
  $('#captchaRefresh').addEventListener('click', refreshChallenge);
  $('#loginForm').addEventListener('submit', login);
  $('#registerForm').addEventListener('submit', register);
  $('#userBtn').addEventListener('click', openSettings);
  $('#moreBtn').addEventListener('click', () => {
    const menu = $('#moreMenu');
    if (menu.hidden) { renderMoreMenu(); menu.hidden = false; }
    else menu.hidden = true;
  });
  document.querySelectorAll('.navbtn').forEach(btn => btn.addEventListener('click', () => switchView(btn.dataset.view)));
  document.addEventListener('click', e => {
    const menu = $('#moreMenu');
    if (!menu.hidden && !menu.contains(e.target) && e.target !== $('#moreBtn')) menu.hidden = true;
  });

  bindCanvas();  window.addEventListener('resize', () => {
    if (app.view === 'tree' && app.tree) {
      const ov = $('#treeView').classList.contains('drawer-open');
      setTimeout(renderCanvas, 50);
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (app.selected.size) { app.selected.clear(); renderCanvas(); }
      else if (app.drawerId) closeDrawer();
    }
  });
}

async function boot() {
  bindEvents();
  renderToolbar();
  try {
    const data = await api('/api/auth/me');
    app.me = data.user;
    await enterApp();
  } catch (e) {
    showAuth();
  }
}

boot();
</script>
