<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>成长树 · 把时间换成看得见的成长</title>
<style nonce="__CSP_NONCE__">
:root{
  --bg:#0b0f14;--bg2:#0e141c;--panel:#121a23;--surface:#17222e;--line:#24313f;
  --fg:#e9f0f7;--muted:#8ea0b3;--accent:#4fd1c5;--accent2:#7c9cff;--gold:#ffd166;
  --danger:#ff6b6b;--ok:#6fe3a1;--radius:14px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:
  radial-gradient(1200px 600px at 15% -10%,rgba(79,209,197,.10),transparent 60%),
  radial-gradient(1000px 500px at 90% 0%,rgba(124,156,255,.09),transparent 55%),
  var(--bg);color:var(--fg);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;transition:.15s}
button:hover{border-color:#3a4b5e;transform:translateY(-1px)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button.primary{background:var(--accent);border-color:transparent;color:#06211f;font-weight:700}
button.primary:hover{filter:brightness(1.06)}
button.ghost{background:transparent}
button.danger{color:var(--danger);border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.06)}
button.mini{padding:3px 7px;border-radius:8px;font-size:12px}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,209,197,.12)}
textarea{resize:vertical;min-height:90px;line-height:1.55}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
a{color:var(--accent2)}
h1,h2,h3{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:8px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel{background:linear-gradient(180deg,rgba(23,34,46,.92),rgba(18,26,35,.94));border:1px solid var(--line);border-radius:var(--radius)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:rgba(124,156,255,.12);border:1px solid rgba(124,156,255,.28);font-size:11px;color:#c4d2ff}
.pill.ok{background:rgba(111,227,161,.1);border-color:rgba(111,227,161,.3);color:#b8f3d1}
.pill.warn{background:rgba(255,209,102,.1);border-color:rgba(255,209,102,.3);color:#ffe6a6}
.pill.mutedp{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--muted)}
.sync{font-size:11px;color:var(--muted);min-width:52px}

/* 认证 */
.auth-view{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth-card{width:min(420px,100%);background:linear-gradient(180deg,rgba(24,35,47,.97),rgba(16,23,31,.98));border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 1px rgba(79,209,197,.06) inset}
.auth-brand{font-size:30px;font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-sub{color:var(--muted);margin:8px 0 20px;line-height:1.7}
.tabs{display:flex;gap:6px;background:var(--bg2);padding:4px;border-radius:12px;margin-bottom:14px}
.tab{flex:1;background:transparent;border:0;padding:8px;border-radius:9px;color:var(--muted)}
.tab.active{background:var(--surface);color:var(--fg);box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.auth-error{min-height:20px;color:var(--danger);font-size:12px;margin-top:10px;line-height:1.5}
.captcha-row{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center}
.captcha-q{background:var(--bg2);border:1px dashed var(--line);border-radius:9px;padding:8px 10px;font-family:var(--mono);letter-spacing:1px;text-align:center;white-space:nowrap}
.auth-foot{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.7}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:10px 16px;background:rgba(11,15,20,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:1px;white-space:nowrap}
.week-tag{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-left:6px}
.mainnav{display:flex;gap:3px;flex-wrap:wrap}
.navbtn{background:transparent;border:1px solid transparent;padding:6px 11px;color:var(--muted);border-radius:9px}
.navbtn:hover{color:var(--fg);background:rgba(255,255,255,.04)}
.navbtn.active{background:rgba(79,209,197,.13);border-color:rgba(79,209,197,.3);color:var(--accent)}
.stats{margin-left:auto;display:flex;align-items:center;gap:14px}
.stat{display:flex;align-items:baseline;gap:6px}
.stat-label{font-size:11px;color:var(--muted)}
.stat strong{font-size:16px;color:var(--accent)}
.exp-wrap{width:86px;height:6px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.exp-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .3s}
.user-btn{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 10px;border-radius:999px}
.more-btn{display:none}

main{padding:12px;max-width:1720px;margin:0 auto}

/* 树视图 */
.tree-view{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px;height:calc(100vh - 76px);min-height:520px}
.tree-view.drawer-open{grid-template-columns:250px minmax(0,1fr) 344px}
.side{overflow:auto;padding:10px}
.side-head{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.side-head h2{font-size:15px}
.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.side-actions button{padding:7px 6px;font-size:12px}
.cat{margin:8px 0;border:1px solid transparent;border-radius:12px;padding:4px}
.cat.active{background:rgba(79,209,197,.05);border-color:rgba(79,209,197,.18)}
.cat-head{display:flex;align-items:center;gap:4px;padding:5px 6px;border-radius:8px}
.cat-head:hover{background:rgba(255,255,255,.03)}
.cat-name{background:transparent;border:0;text-align:left;flex:1;font-weight:700;color:var(--fg);padding:3px 4px;border-radius:6px;font-size:13px}
.cat-count{font-size:11px;color:var(--muted);font-family:var(--mono)}
.cat-tools{display:flex;gap:2px;opacity:.55}
.cat:hover .cat-tools{opacity:1}
.side-node{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent;font-size:12.5px}
.side-node:hover{background:rgba(255,255,255,.04);border-color:var(--line)}
.side-node.leaf{padding-left:22px;color:#c5d3e1}
.side-node .dot{width:7px;height:7px;border-radius:50%;background:#35485c;flex:0 0 auto}
.side-node .dot.on{background:var(--accent);box-shadow:0 0 8px rgba(79,209,197,.8)}
.side-node .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-node .cost{color:var(--gold);font-size:11px}
.empty{padding:16px 8px;color:var(--muted);font-size:12px;text-align:center;line-height:1.7}

.canvas-wrap{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);background:
  radial-gradient(circle at 20% 20%,rgba(79,209,197,.05),transparent 40%),
  radial-gradient(circle at 80% 80%,rgba(124,156,255,.05),transparent 40%),
  #0c1219;touch-action:none;min-height:420px}
.canvas-toolbar{position:absolute;z-index:12;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}
.canvas-toolbar>*{pointer-events:auto}
.canvas-toolbar .grow{flex:1}
.canvas-hint{position:absolute;left:12px;bottom:10px;color:#5c6d7f;font-size:11px;pointer-events:none;z-index:5}
#canvasLayer{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.cgroup{position:absolute;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(20,30,41,.55),rgba(14,20,27,.5));box-shadow:0 16px 40px rgba(0,0,0,.25)}
.cgroup-head{position:absolute;left:12px;right:12px;top:9px;display:flex;align-items:center;gap:8px;cursor:pointer;padding:2px 4px;border-radius:8px}
.cgroup-head:hover{background:rgba(255,255,255,.03)}
.cgroup-head.selected{outline:2px solid var(--accent2);outline-offset:2px;border-radius:8px}
.cgroup-title{font-weight:700;font-size:13px}
.cgroup-meta{font-size:11px;color:var(--muted);font-family:var(--mono)}
.cgroup-head .pill{margin-left:auto}
.cnode{position:absolute;width:190px;min-height:76px;padding:10px 11px;border-radius:12px;background:linear-gradient(160deg,#1a2734,#141e29);border:1px solid var(--line);cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.22);transition:border-color .15s,box-shadow .15s,transform .15s}
.cnode:hover{border-color:#3d5268;transform:translateY(-1px)}
.cnode.locked{opacity:.8;border-style:dashed}
.cnode.unlocked{border-color:rgba(79,209,197,.55);box-shadow:0 0 22px rgba(79,209,197,.12),0 8px 20px rgba(0,0,0,.22)}
.cnode.selected{outline:2px solid var(--accent2);outline-offset:2px}
.cnode .n-title{font-weight:700;font-size:13px;line-height:1.35;word-break:break-word}
.cnode .n-meta{display:flex;gap:6px;align-items:center;margin-top:7px;font-size:11px;color:var(--muted)}
.cnode .n-cost{color:var(--gold);font-family:var(--mono)}
.cnode .n-note{margin-top:6px;font-size:11px;color:#8fa3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnode .n-badge{position:absolute;right:8px;top:8px;width:7px;height:7px;border-radius:50%;background:#35485c}
.cnode.unlocked .n-badge{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.multi-bar{position:absolute;z-index:15;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:rgba(15,22,30,.96);border:1px solid var(--line);border-radius:999px;padding:7px 10px 7px 16px;box-shadow:0 16px 40px rgba(0,0,0,.4)}
.visitor-banner{position:absolute;z-index:14;left:50%;top:52px;transform:translateX(-50%);background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.35);color:#ffe6a6;padding:6px 12px;border-radius:999px;font-size:12px;display:flex;gap:10px;align-items:center}

/* 抽屉 */
.drawer{overflow:auto;padding:12px}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.drawer-title{font-size:16px;font-weight:800;word-break:break-word}
.drawer-sub{color:var(--muted);font-size:11px;margin-top:3px;font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{padding:4px 9px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:11.5px;cursor:pointer;color:var(--muted)}
.chip.on{background:rgba(124,156,255,.16);border-color:rgba(124,156,255,.45);color:#d6e0ff}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.photo-item{position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden;aspect-ratio:1;background:var(--bg2)}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block}
.photo-item .x{position:absolute;right:3px;top:3px;padding:0 5px;font-size:11px;line-height:17px;border-radius:6px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.15)}
.drawer-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.drawer-actions .wide{grid-column:1/-1}
.hint-line{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.55}
.divider{height:1px;background:var(--line);margin:12px 0}

/* 课表 */
.tt-shell{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px}
.tt-panel{padding:10px}
.tt-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 2px 10px}
.tt-scroll{overflow:auto;max-height:calc(100vh - 178px);border-radius:10px;border:1px solid var(--line);background:#0c1219}
.tt-inner{position:relative;min-width:860px}
.tt-table{display:grid;grid-template-columns:46px repeat(7,minmax(108px,1fr))}
.tt-corner,.tt-dayhead{position:sticky;top:0;z-index:8;background:#0f1720;border-bottom:1px solid var(--line);padding:8px 4px;text-align:center;font-size:12px;color:var(--muted)}
.tt-corner{left:0;z-index:9;border-right:1px solid var(--line)}
.tt-axis{position:relative;height:840px;border-right:1px solid var(--line);background:#0f1720}
.tt-axis span{position:absolute;right:5px;font-size:10px;color:#65788c;font-family:var(--mono);transform:translateY(-6px)}
.tt-axis span:first-child{transform:none}
.tt-axis span:last-child{transform:translateY(-100%)}
.tt-col{position:relative;height:840px;border-left:1px solid rgba(36,49,63,.55);background-image:repeating-linear-gradient(to bottom,rgba(255,255,255,.045) 0 1px,transparent 1px 60px)}
.tt-col:nth-child(odd){background-color:rgba(255,255,255,.008)}
.tt-card{position:absolute;border-radius:8px;padding:4px 6px;overflow:hidden;cursor:pointer;font-size:11.5px;line-height:1.25;z-index:3;border:1px solid;transition:box-shadow .15s}
.tt-card.course{background:rgba(79,209,197,.18);border-color:rgba(79,209,197,.55);color:#d9fbf7}
.tt-card.plan{background:rgba(124,156,255,.07);border:1px dashed rgba(124,156,255,.65);color:#d6e0ff}
.tt-card.break{height:20px!important;padding:0 5px;background:rgba(255,209,102,.1);border:1px dashed rgba(255,209,102,.55);color:#ffe6a6;z-index:4;font-size:10px;display:flex;align-items:center}
.tt-card.selected{outline:2px solid var(--gold);outline-offset:1px;z-index:6}
.tt-card.highlight{box-shadow:0 0 0 2px rgba(124,156,255,.85),0 0 16px rgba(124,156,255,.5)}
.tt-card .t-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-card .t-time{font-size:10px;opacity:.8;font-family:var(--mono)}
.tt-card .t-del{position:absolute;right:2px;top:2px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);border-radius:5px;padding:0 4px;font-size:10px;line-height:15px}
.tt-nowline{position:absolute;left:46px;right:0;height:0;border-top:2px solid #ff5c5c;z-index:20;pointer-events:none;filter:drop-shadow(0 0 6px rgba(255,92,92,.55))}
.tt-nowline .now-label{position:absolute;right:6px;top:-18px;font-size:10px;color:#ff8a8a;background:rgba(255,92,92,.12);border:1px solid rgba(255,92,92,.35);border-radius:6px;padding:0 5px}
.tt-pet{position:absolute;right:52px;top:-23px;width:40px;height:40px;image-rendering:pixelated;pointer-events:none}
.tt-side{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 178px);overflow:auto}
.tt-box{padding:10px}
.tt-box h3{font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.tt-list{display:flex;flex-direction:column;gap:4px}
.tt-list-row{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:7px;border:1px solid transparent;cursor:pointer;font-size:12px}
.tt-list-row:hover{background:rgba(255,255,255,.04);border-color:var(--line)}
.tt-list-row.hl{background:rgba(124,156,255,.12);border-color:rgba(124,156,255,.35)}
.tt-list-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt-list-row .cnt{font-size:10px;color:var(--muted);font-family:var(--mono)}
.rate-row{display:flex;align-items:center;gap:10px}
.rate-row input[type=range]{padding:0;background:transparent;border:0}
.formula{font-size:11.5px;color:var(--muted);line-height:1.8;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px;margin-top:8px;font-family:var(--mono);white-space:pre-line}
.task-row{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px}
.task-row input[type=checkbox]{width:auto;padding:0}
.task-row .tm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-row .tp{color:var(--gold);font-family:var(--mono);font-size:11px}
.pet-select{padding:4px 8px;width:auto}

/* 笔记 */
.notes-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px;min-height:calc(100vh - 100px)}
.notes-side{padding:10px;display:flex;flex-direction:column;gap:8px}
.note-item{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent;font-size:12.5px}
.note-item:hover{background:rgba(255,255,255,.04);border-color:var(--line)}
.note-item.active{background:rgba(79,209,197,.1);border-color:rgba(79,209,197,.3)}
.note-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notes-editor{padding:12px;display:flex;flex-direction:column;gap:8px;min-height:480px}
.notes-editor textarea{flex:1;min-height:360px;font-family:var(--mono);font-size:13px}
.md-preview{flex:1;overflow:auto;line-height:1.8;font-size:13.5px;padding:12px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;min-height:360px}
.md-preview h1,.md-preview h2,.md-preview h3{margin:14px 0 8px;line-height:1.4}
.md-preview p{margin:7px 0}
.md-preview code{background:rgba(255,255,255,.07);padding:1px 5px;border-radius:5px;font-family:var(--mono);font-size:12px}
.md-preview pre{background:#0a0f14;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto}
.md-preview pre code{background:transparent;padding:0}
.md-preview blockquote{border-left:3px solid var(--accent);margin:8px 0;padding:2px 10px;color:var(--muted)}
.md-preview ul{margin:6px 0;padding-left:20px}
.md-preview a{color:var(--accent2)}
.mode-tabs{display:flex;gap:4px}
.mode-tabs .chip{border-radius:8px}
.mode-tabs .chip.on{background:rgba(79,209,197,.14);border-color:rgba(79,209,197,.4);color:var(--accent)}

/* 蓝图 */
.view-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.view-head h1{font-size:19px}
.bp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.bp-card{padding:14px;border-radius:var(--radius);background:linear-gradient(170deg,rgba(24,36,48,.95),rgba(16,23,31,.96));border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 36px rgba(0,0,0,.22)}
.bp-card h3{font-size:15px;line-height:1.4}
.bp-card .bp-note{color:var(--muted);font-size:12px;line-height:1.6;max-height:40px;overflow:hidden}
.bp-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
.score{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;color:var(--gold)}
.score-bar{flex:1;height:5px;border-radius:999px;background:var(--bg2);overflow:hidden}
.score-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));width:0}
.bp-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.empty-state{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);line-height:1.8}

/* 好友/反馈/管理 */
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.box{padding:14px}
.box h3{font-size:14px;margin-bottom:10px}
.user-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;border:1px solid transparent}
.user-row:hover{background:rgba(255,255,255,.035);border-color:var(--line)}
.user-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb-item{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);margin-bottom:8px}
.fb-head{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);margin-bottom:6px}
.fb-text{font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.reply{margin-top:8px;padding:8px;border-left:2px solid var(--accent2);background:rgba(124,156,255,.05);border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.6;white-space:pre-wrap}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;background:rgba(255,255,255,.025);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;max-width:320px}

/* 弹窗/提示 */
.modal-backdrop{position:fixed;inset:0;z-index:90;background:rgba(3,6,9,.66);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:min(680px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#141d27,#101720);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.modal-head h2{font-size:17px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.modal .wide{width:100%}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:120;background:#182532;border:1px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:0 16px 48px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.22s;max-width:min(560px,92vw);font-size:13px;line-height:1.5}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{border-color:rgba(255,107,107,.45);color:#ffc9c9}
.toast.ok{border-color:rgba(111,227,161,.4);color:#c8f8dd}
.more-menu{position:fixed;right:12px;top:58px;z-index:60;background:#141d27;border:1px solid var(--line);border-radius:12px;padding:6px;min-width:170px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.more-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px}
.more-menu button:hover{background:rgba(255,255,255,.06)}
.image-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.image-strip img{width:92px;height:92px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.node-note-block{padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:6px;background:var(--bg2)}
.node-note-block .t{font-weight:700;font-size:12.5px}
.node-note-block .n{font-size:12px;color:var(--muted);line-height:1.6;white-space:pre-wrap;margin-top:4px}
.kv{display:grid;grid-template-columns:84px 1fr;gap:6px 10px;font-size:12px}
.kv .k{color:var(--muted)}
.kv .v{word-break:break-word}
.hr{height:1px;background:var(--line);margin:12px 0}

@media (max-width:1100px){
  .mainnav{display:none}
  .more-btn{display:inline-flex}
  .stats .stat-label{display:none}
  .tree-view.drawer-open{grid-template-columns:250px minmax(0,1fr)}
  .drawer{position:fixed;z-index:55;right:10px;bottom:10px;top:64px;width:min(360px,calc(100vw - 20px));background:var(--panel);box-shadow:0 20px 60px rgba(0,0,0,.55)}
  .tt-shell{grid-template-columns:1fr}
  .tt-side{max-height:none}
  .two-col{grid-template-columns:1fr}
}
@media (max-width:760px){
  .topbar{gap:8px;padding:8px 10px;flex-wrap:wrap}
  .stats{gap:8px}
  .exp-wrap{display:none}
  main{padding:8px}
  .tree-view,.tree-view.drawer-open{grid-template-columns:1fr;height:auto}
  .side{max-height:170px}
  .canvas-wrap{height:62vh}
  .canvas-hint{display:none}
  .notes-layout{grid-template-columns:1fr}
  .notes-layout .notes-side{max-height:190px}
  .view-head h1{font-size:16px}
  .modal{padding:14px}
  .tt-card{font-size:10.5px}
  .bp-grid{grid-template-columns:1fr}
  .stats .stat strong{font-size:14px}
  .user-btn{max-width:80px}
}
</style>
</head>
<body>

<div id="authView" class="auth-view" hidden>
  <div class="auth-card">
    <div class="auth-brand">成长树</div>
    <p class="auth-sub">把本周的空闲时间，按转化率换成科技点，点亮你的能力与知识点。</p>
    <div class="tabs">
      <button id="tabLogin" class="tab active" type="button">登录</button>
      <button id="tabRegister" class="tab" type="button">注册</button>
    </div>
    <form id="loginForm" autocomplete="on">
      <label for="loginName">用户名</label>
      <input id="loginName" name="username" autocomplete="username" maxlength="20" required>
      <label for="loginPassword">密码</label>
      <input id="loginPassword" name="password" type="password" autocomplete="current-password" maxlength="128" required>
      <div class="modal-foot"><button class="primary wide" type="submit">登录</button></div>
    </form>
    <form id="registerForm" hidden autocomplete="on">
      <label for="regName">用户名（2–20 位）</label>
      <input id="regName" name="username" autocomplete="username" maxlength="20" required>
      <label for="regPassword">密码（至少 8 位）</label>
      <input id="regPassword" name="new-password" type="password" autocomplete="new-password" maxlength="128" required>
      <label for="regConfirm">确认密码</label>
      <input id="regConfirm" type="password" autocomplete="new-password" maxlength="128" required>
      <label>算术验证码</label>
      <div class="captcha-row">
        <div id="captchaQuestion" class="captcha-q">加载中…</div>
        <input id="captchaAnswer" inputmode="numeric" autocomplete="off" placeholder="答案" maxlength="4" required>
        <button id="captchaRefresh" class="ghost mini" type="button">换一题</button>
      </div>
      <div class="modal-foot"><button class="primary wide" type="submit">注册并进入</button></div>
    </form>
    <div id="authError" class="auth-error" role="alert"></div>
    <div class="auth-foot">密码使用 scrypt 加盐存储；会话仅保存在 httpOnly Cookie 中。<br>超级管理员用户名：<span class="mono">protractor45</span></div>
  </div>
</div>

<div id="appView" hidden>
  <header class="topbar">
    <div class="brand">成长树<span id="weekLabel" class="week-tag"></span></div>
    <nav class="mainnav" id="mainNav">
      <button class="navbtn active" type="button" data-view="tree">树</button>
      <button class="navbtn" type="button" data-view="timetable">课表</button>
      <button class="navbtn" type="button" data-view="notes">笔记</button>
      <button class="navbtn" type="button" data-view="blueprints">蓝图</button>
      <button class="navbtn" type="button" data-view="friends">好友</button>
      <button class="navbtn" type="button" data-view="feedback">反馈</button>
      <button class="navbtn" type="button" data-view="admin" id="adminNav" hidden>管理</button>
    </nav>
    <div class="stats">
      <span id="syncState" class="sync"></span>
      <div class="stat"><span class="stat-label">科技点</span><strong id="pointsValue" class="mono">0</strong></div>
      <div class="stat"><span class="stat-label">Lv</span><strong id="levelValue" class="mono">1</strong></div>
      <div class="exp-wrap" title="经验值"><div id="expFill" class="exp-fill"></div></div>
      <button id="userBtn" class="user-btn" type="button" title="账号与设置"></button>
    </div>
    <button id="moreBtn" class="more-btn" type="button" aria-label="更多">⋯</button>
  </header>
  <div id="moreMenu" class="more-menu" hidden></div>

  <main>
    <section id="treeView" class="view tree-view">
      <aside id="treeSide" class="panel side"></aside>
      <div id="canvasWrap" class="canvas-wrap">
        <div id="canvasToolbar" class="canvas-toolbar"></div>
        <div id="visitorBanner" class="visitor-banner" hidden></div>
        <div id="canvasLayer"></div>
        <div id="multiBar" class="multi-bar" hidden></div>
        <div class="canvas-hint">拖空白平移 · 滚轮缩放 · Ctrl+点击多选</div>
      </div>
      <aside id="drawer" class="panel drawer" hidden></aside>
    </section>

    <section id="timetableView" class="view" hidden></section>
    <section id="notesView" class="view" hidden></section>
    <section id="blueprintsView" class="view" hidden></section>
    <section id="friendsView" class="view" hidden></section>
    <section id="feedbackView" class="view" hidden></section>
    <section id="adminView" class="view" hidden></section>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script nonce="__CSP_NONCE__">
'use strict';

// ---------------------------------------------------------------- 基础工具
const $ = sel => document.querySelector(sel);
const uuid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(16).slice(2) + Date.now().toString(16));

function h(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  if (tag === 'button' && !('type' in attrs)) node.type = 'button';
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = String(v);
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'checked' || k === 'disabled' || k === 'selected' || k === 'draggable') node[k] = !!v;
    else if (k === 'value') node.value = v;
    else node.setAttribute(k, v === true ? '' : String(v));
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return node;
}

function fmtNum(v) {
  const n = Number(v) || 0;
  return Number.isInteger(n) ? String(n) : String(Math.round(n * 10) / 10);
}
function pad2(n) { return String(n).padStart(2, '0'); }
function minToTime(m) { return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60); }
function timeToMin(t) {
  if (!/^\d{2}:\d{2}$/.test(String(t || ''))) return null;
  const [hh, mm] = String(t).split(':').map(Number);
  return hh * 60 + mm;
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '—';
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function dayName(n) { return ['周一', '周二', '周三', '周四', '周五', '周六', '周日'][n - 1] || ''; }

function setSync(text) { const el = $('#syncState'); if (el) el.textContent = text || ''; }

let toastTimer = null;
function toast(message, kind = 'info') {
  const el = $('#toast');
  el.textContent = message;
  el.className = 'toast show' + (kind === 'error' ? ' error' : kind === 'ok' ? ' ok' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3400);
}

// ---------------------------------------------------------------- API
async function api(path, opts = {}) {
  const init = { method: opts.method || 'GET', credentials: 'same-origin', headers: new Headers(opts.headers || {}) };
  if (opts.body !== undefined && opts.body !== null) {
    init.body = opts.body;
    if (typeof opts.body === 'string' && !opts.raw && !init.headers.has('Content-Type')) init.headers.set('Content-Type', 'application/json');
  }
  const res = await fetch(path, init);
  const type = res.headers.get('content-type') || '';
  let data = null;
  if (type.includes('application/json')) data = await res.json().catch(() => null);
  else data = await res.text().catch(() => '');
  if (!res.ok) {
    const err = new Error((data && data.error) || (typeof data === 'string' && data) || '请求失败');
    err.status = res.status;
    throw err;
  }
  return data;
}

function handleApiError(error) {
  if (error && error.status === 401) { showAuth(); return; }
  toast((error && error.message) || '操作失败', 'error');
}

// ---------------------------------------------------------------- 弹窗
let modalClosers = [];
function openModal(title, content, actions = [], options = {}) {
  closeModal();
  const foot = h('div', { class: 'modal-foot' });
  const close = () => closeModal();
  const card = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' },
    h('div', { class: 'modal-head' }, h('h2', { text: title }), h('button', { class: 'ghost mini', type: 'button', onclick: close, 'aria-label': '关闭', text: '✕' })),
    content,
    actions.length ? foot : null
  );
  for (const a of actions) {
    if (!a) continue;
    foot.append(h('button', { class: a.primary ? 'primary' : a.danger ? 'danger' : '', type: 'button', onclick: a.onClick, text: a.label }));
  }
  const backdrop = h('div', { class: 'modal-backdrop' }, card);
  backdrop.addEventListener('click', e => { if (e.target === backdrop && options.closeOnBackdrop !== false) close(); });
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  const closer = () => {
    document.removeEventListener('keydown', onKey);
    if (backdrop.parentNode) backdrop.remove();
    modalClosers = modalClosers.filter(x => x !== closer);
    if (options.onClose) options.onClose();
  };
  modalClosers.push(closer);
  $('#modalRoot').append(backdrop);
  const input = card.querySelector('input,textarea,select');
  if (input) setTimeout(() => input.focus(), 30);
  return { close, card, onClose(fn) { options.onClose = fn; }, setActions(list) { /* reserved */ } };
}
function closeModal() { const list = modalClosers.slice(); modalClosers = []; for (const fn of list) fn(); }

function confirmDialog(message, confirmLabel = '确认') {
  return new Promise(resolve => {
    let settled = false;
    const done = v => { if (settled) return; settled = true; resolve(v); };
    const modal = openModal('请确认', h('p', { class: 'muted', text: message }), [
      { label: '取消', onClick: () => { done(false); modal.close(); } },
      { label: confirmLabel, danger: true, onClick: () => { done(true); modal.close(); } },
    ], { onClose: () => done(false) });
  });
}

// ---------------------------------------------------------------- 应用状态
const app = {
  me: null,
  tree: null,
  meta: null,
  readOnly: false,
  visitor: null,
  view: 'tree',
  category: '',
  selected: new Set(),
  drawerId: null,
  transform: { x: 40, y: 30, scale: 1 },
  pan: null,
  fitted: false,
  multiDirty: false,
  ttSelected: null,
  ttCtrl: null,
  ttHighlight: '',
  ttNowTimer: null,
  ttPetTimer: null,
  pet: localStorage.getItem('pet') || 'cat',
  notes: { mode: 'server', list: [], current: null, content: '', preview: false, dir: null, localList: [] },
  bps: { list: [], category: '', q: '' },
  friends: { data: null, search: [] },
  chat: { id: null, timer: null },
  saveSeq: 0,
  rateTimer: null,
};

// ---------------------------------------------------------------- 认证
let challengeId = null;

function setAuthError(msg) { $('#authError').textContent = msg || ''; }

async function refreshChallenge() {
  try {
    const data = await api('/api/auth/challenge');
    challengeId = data.id;
    $('#captchaQuestion').textContent = data.question;
  } catch (e) {
    $('#captchaQuestion').textContent = '加载失败';
  }
}

function switchAuthTab(register) {
  $('#tabLogin').classList.toggle('active', !register);
  $('#tabRegister').classList.toggle('active', register);
  $('#loginForm').hidden = register;
  $('#registerForm').hidden = !register;
  setAuthError('');
  if (register) refreshChallenge();
}

function showAuth() {
  $('#appView').hidden = true;
  $('#authView').hidden = false;
  stopTtTimers();
  app.me = null;
  app.tree = null;
  app.meta = null;
  $('#authError').textContent = '';
}

async function login(event) {
  event.preventDefault();
  setAuthError('');
  const btn = $('#loginForm button[type=submit]');
  btn.disabled = true;
  try {
    const data = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ name: $('#loginName').value.trim(), password: $('#loginPassword').value }) });
    app.me = data.user;
    await enterApp();
  } catch (e) {
    setAuthError(e.message || '登录失败');
  } finally {
    btn.disabled = false;
  }
}

async function register(event) {
  event.preventDefault();
  setAuthError('');
  const name = $('#regName').value.trim();
  const pwd = $('#regPassword').value;
  if (pwd !== $('#regConfirm').value) { setAuthError('两次输入的密码不一致'); return; }
  if (!challengeId) { setAuthError('请先获取验证码'); return; }
  const btn = $('#registerForm button[type=submit]');
  btn.disabled = true;
  try {
    const data = await api('/api/auth/register', {
      method: 'POST',
      body: JSON.stringify({ name, password: pwd, challengeId, answer: Number($('#captchaAnswer').value) }),
    });
    app.me = data.user;
    await enterApp();
  } catch (e) {
    setAuthError(e.message || '注册失败');
    refreshChallenge();
    $('#captchaAnswer').value = '';
  } finally {
    btn.disabled = false;
  }
}

async function enterApp() {
  $('#authView').hidden = true;
  $('#appView').hidden = false;
  $('#userBtn').textContent = app.me.name;
  $('#adminNav').hidden = app.me.role !== 'admin';
  await loadTree();
  switchView('tree');
}

async function logout() {
  try { await api('/api/auth/logout', { method: 'POST' }); } catch {}
  closeModal();
  showAuth();
}

// ---------------------------------------------------------------- 树：加载与保存
function findNode(id) { return (app.tree && app.tree.abilities) ? app.tree.abilities.find(a => a.id === id) : null; }
function groupOf(node) {
  if (!node) return null;
  return node.kind === 'group' ? node : findNode(node.parentId);
}
function groupCost(g) {
  return app.tree.abilities.filter(a => a.kind === 'leaf' && a.parentId === g.id).reduce((s, a) => s + (Number(a.cost) || 0), 0);
}

async function loadTree() {
  const data = await api('/api/tree');
  app.tree = data.tree;
  app.meta = data.meta;
  app.readOnly = false;
  app.visitor = null;
  app.selected.clear();
  app.drawerId = null;
  app.fitted = false;
  $('#drawer').hidden = true;
  $('#treeView').classList.remove('drawer-open');
  updateHeader();
  renderTreeAll();
}

function updateHeader() {
  if (!app.meta) return;
  $('#pointsValue').textContent = fmtNum(app.meta.available);
  $('#levelValue').textContent = String(app.meta.level);
  $('#userBtn').textContent = app.me ? app.me.name : '';
  $('#weekLabel').textContent = app.tree ? app.tree.week.key : '';
  const pct = app.meta.level >= 15 ? 100 : Math.max(0, Math.min(100, ((app.meta.exp % 100) / 100) * 100));
  $('#expFill').style.width = pct + '%';
  $('#expFill').title = `经验 ${app.meta.exp}/1500 · Lv ${app.meta.level}`;
}

async function persistTree(options = {}) {
  if (app.readOnly) { toast('访客模式：只读查看', 'error'); return false; }
  const seq = ++app.saveSeq;
  setSync('保存中…');
  try {
    const data = await api('/api/tree', { method: 'PUT', body: JSON.stringify(app.tree) });
    if (seq !== app.saveSeq) return true;
    app.tree = data.tree;
    app.meta = data.meta;
    setSync('已保存');
    updateHeader();
    if (options.render !== false) {
      renderSidebar();
      renderCanvas();
      renderDrawer();
      if (app.view === 'timetable') renderTimetable();
    }
    return true;
  } catch (e) {
    setSync('');
    handleApiError(e);
    if (e.status !== 401) { try { await loadTree(); } catch {} }
    return false;
  }
}

function renderTreeAll() {
  renderToolbar();
  renderVisitorBanner();
  renderSidebar();
  renderCanvas();
  renderDrawer();
  if (app.view === 'timetable') renderTimetable();
}

function renderVisitorBanner() {
  const el = $('#visitorBanner');
  if (!el) return;
  el.hidden = !app.readOnly;
  if (app.readOnly && app.visitor) {
    el.replaceChildren(
      h('span', { text: `只读查看：${app.visitor.name} 的成长树` }),
      h('button', { class: 'mini ghost', type: 'button', text: '返回我的树', onclick: () => loadTree().then(() => toast('已返回自己的树', 'ok')) })
    );
  }
}

// ---------------------------------------------------------------- 侧栏
function renderSidebar() {
  const side = $('#treeSide');
  if (!side) return;
  side.replaceChildren();
  side.append(h('div', { class: 'side-head' },
    h('h2', { text: app.readOnly ? '访客浏览' : '我的成长树' }),
    h('button', { class: 'ghost mini', type: 'button', text: '全部', onclick: () => { app.category = ''; renderSidebar(); renderCanvas(); } })
  ));
  const cats = (app.tree && app.tree.categories) || [];
  for (const cat of cats) {
    const groups = app.tree.abilities.filter(a => a.kind === 'group' && a.categoryId === cat.id);
    const sec = h('section', { class: 'cat' + (app.category === cat.id ? ' active' : '') });
    const head = h('div', { class: 'cat-head' });
    head.append(h('button', { class: 'cat-name', type: 'button', text: cat.name, onclick: () => { app.category = app.category === cat.id ? '' : cat.id; renderSidebar(); renderCanvas(); } }));
    head.append(h('span', { class: 'cat-count', text: String(groups.length) }));
    if (!app.readOnly) {
      const tools = h('span', { class: 'cat-tools' });
      tools.append(h('button', { class: 'mini ghost', type: 'button', text: '+', title: '在此分类新建能力组', onclick: () => openNodeModal('group', { categoryId: cat.id }) }));
      tools.append(h('button', { class: 'mini ghost', type: 'button', text: '✎', title: '重命名分类', onclick: () => openCategoryModal(cat) }));
      tools.append(h('button', { class: 'mini ghost', type: 'button', text: '×', title: '删除分类', onclick: () => deleteCategory(cat) }));
      head.append(tools);
    }
    sec.append(head);
    sec.addEventListener('dragover', e => { if (!app.readOnly) e.preventDefault(); });
    sec.addEventListener('drop', e => {
      if (app.readOnly) return;
      e.preventDefault();
      const id = e.dataTransfer.getData('text/plain');
      const node = findNode(id);
      if (node && node.kind === 'group') { node.categoryId = cat.id; persistTree(); }
    });
    if (!groups.length) {
      sec.append(h('div', { class: 'empty', text: '暂无能力组' }));
    }
    for (const g of groups) {
      sec.append(sidebarRow(g, false));
      const leaves = app.tree.abilities.filter(a => a.kind === 'leaf' && a.parentId === g.id);
      for (const leaf of leaves) sec.append(sidebarRow(leaf, true));
    }
    side.append(sec);
  }
  if (!app.readOnly) {
    side.append(h('div', { class: 'side-actions' },
      h('button', { type: 'button', text: '＋ 能力组', onclick: () => openNodeModal('group') }),
      h('button', { type: 'button', text: '＋ 知识点', onclick: () => openNodeModal('leaf') }),
      h('button', { type: 'button', class: 'wide', text: '＋ 已掌握知识点', onclick: () => openNodeModal('leaf', { mastered: true }) }),
      h('button', { type: 'button', text: '＋ 分类', onclick: () => openCategoryModal(null) })
    ));
  }
}

function sidebarRow(node, isLeaf) {
  const row = h('div', {
    class: 'side-node' + (isLeaf ? ' leaf' : ''),
    draggable: !app.readOnly,
    title: node.name,
    onclick: () => openDrawer(node.id),
  });
  row.append(h('span', { class: 'dot' + (node.unlocked ? ' on' : '') }));
  row.append(h('span', { class: 'nm', text: node.name }));
  row.append(h('span', { class: 'cost', text: node.kind === 'group' ? `Σ${groupCost(node)}` : String(node.cost) }));
  if (!app.readOnly) {
    row.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', node.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragover', e => e.preventDefault());
    row.addEventListener('drop', e => {
      e.preventDefault();
      const id = e.dataTransfer.getData('text/plain');
      if (!id || id === node.id) return;
      const dragged = findNode(id);
      if (!dragged) return;
      if (dragged.kind === 'leaf' && node.kind === 'group') {
        dragged.parentId = node.id;
        dragged.prereqIds = [];
      } else if (dragged.kind === node.kind) {
        const list = app.tree.abilities;
        const from = list.findIndex(a => a.id === id);
        const to = list.findIndex(a => a.id === node.id);
        list.splice(from, 1);
        list.splice(to, 0, dragged);
        if (dragged.kind === 'group') dragged.categoryId = node.categoryId;
        else dragged.parentId = node.parentId;
      } else {
        toast('不同层级的节点不能互相排序', 'error');
        return;
      }
      persistTree();
    });
  }
  return row;
}

function openCategoryModal(cat) {
  const name = h('input', { maxlength: 30, value: cat ? cat.name : '', placeholder: '例如：语言、设计、生活' });
  const modal = openModal(cat ? '重命名分类' : '新建分类', h('div', {}, h('label', { text: '分类名称' }), name), [
    { label: '取消', onClick: () => modal.close() },
    { label: '保存', primary: true, onClick: async () => {
      const value = name.value.trim();
      if (!value) { toast('分类名称不能为空', 'error'); return; }
      if (cat) cat.name = value;
      else app.tree.categories.push({ id: 'cat_' + uuid().replace(/-/g, '').slice(0, 10), name: value });
      modal.close();
      await persistTree();
    } },
  ]);
}

async function deleteCategory(cat) {
  const has = app.tree.abilities.some(a => a.kind === 'group' && a.categoryId === cat.id);
  if (has) { toast('该分类下还有能力组，先移动或删除它们', 'error'); return; }
  if (app.tree.categories.length <= 1) { toast('至少保留一个分类', 'error'); return; }
  if (!(await confirmDialog(`删除分类「${cat.name}」？`, '删除'))) return;
  app.tree.categories = app.tree.categories.filter(c => c.id !== cat.id);
  await persistTree();
}

// ---------------------------------------------------------------- 画布
function leafDepth(leaf, leavesById, memo, seen) {
  if (memo.has(leaf.id)) return memo.get(leaf.id);
  if (seen.has(leaf.id)) return 0;
  seen.add(leaf.id);
  let d = 0;
  for (const pid of leaf.prereqIds || []) {
    const pre = leavesById.get(pid);
    if (pre) d = Math.max(d, leafDepth(pre, leavesById, memo, seen) + 1);
  }
  seen.delete(leaf.id);
  d = Math.min(d, 8);
  memo.set(leaf.id, d);
  return d;
}

function renderCanvas() {
  if (!app.tree) return;
  const layer = $('#canvasLayer');
  layer.replaceChildren();
  const groups = app.tree.abilities.filter(a => a.kind === 'group' && (!app.category || a.categoryId === app.category));
  let cursorY = 22;
  let maxWidth = 400;
  for (const g of groups) {
    const leaves = app.tree.abilities.filter(a => a.kind === 'leaf' && a.parentId === g.id);
    const leavesById = new Map(leaves.map(l => [l.id, l]));
    const depthMemo = new Map();
    for (const leaf of leaves) leafDepth(leaf, leavesById, depthMemo, new Set());
    const columns = new Map();
    for (const leaf of leaves) {
      const d = depthMemo.get(leaf.id) || 0;
      if (!columns.has(d)) columns.set(d, []);
      columns.get(d).push(leaf);
    }
    const depths = [...columns.keys()].sort((a, b) => a - b);
    const maxDepth = depths.length ? depths[depths.length - 1] : 0;
    const rowsById = new Map();
    let nextRow = 0;
    for (const d of depths) {
      const list = columns.get(d);
      list.sort((a, b) => {
        const aa = (a.prereqIds || []).map(id => rowsById.get(id)).filter(v => Number.isFinite(v));
        const bb = (b.prereqIds || []).map(id => rowsById.get(id)).filter(v => Number.isFinite(v));
        const av = aa.length ? aa.reduce((s, v) => s + v, 0) / aa.length : (Number(a.oy) || 0) / 1000;
        const bv = bb.length ? bb.reduce((s, v) => s + v, 0) / bb.length : (Number(b.oy) || 0) / 1000;
        return av - bv || String(a.name).localeCompare(String(b.name), 'zh');
      });
      let row = 0;
      for (const leaf of list) {
        rowsById.set(leaf.id, row);
        row++;
      }
      nextRow = Math.max(nextRow, list.length);
    }
    const width = Math.max(320, 44 + (maxDepth + 1) * 218);
    const height = 58 + Math.max(1, nextRow) * 96 + 16;
    const box = h('div', { class: 'cgroup' });
    box.style.left = '22px';
    box.style.top = cursorY + 'px';
    box.style.width = width + 'px';
    box.style.height = height + 'px';
    const cat = app.tree.categories.find(c => c.id === g.categoryId);
    const head = h('div', { class: 'cgroup-head' + (app.selected.has(g.id) ? ' selected' : '') });
    head.append(h('span', { class: 'cgroup-title', text: g.name }));
    head.append(h('span', { class: 'cgroup-meta', text: `Σ ${groupCost(g)} · ${leaves.length} 个知识点` }));
    head.append(h('span', { class: 'pill mutedp', text: cat ? cat.name : '未分类' }));
    head.addEventListener('click', e => {
      e.stopPropagation();
      if (e.ctrlKey || e.metaKey) toggleSelect(g.id);
      else openDrawer(g.id);
    });
    box.append(head);

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', String(width));
    svg.setAttribute('height', String(height));
    svg.style.position = 'absolute';
    svg.style.left = '0';
    svg.style.top = '0';
    svg.style.pointerEvents = 'none';

    const positions = new Map();
    for (const leaf of leaves) {
      const d = depthMemo.get(leaf.id) || 0;
      const row = rowsById.get(leaf.id) || 0;
      const x = 22 + d * 218;
      const y = 58 + row * 96;
      positions.set(leaf.id, { x, y });
    }
    for (const leaf of leaves) {
      const pos = positions.get(leaf.id);
      for (const pid of leaf.prereqIds || []) {
        const pre = positions.get(pid);
        if (!pre) continue;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const x1 = pre.x + 190, y1 = pre.y + 38, x2 = pos.x, y2 = pos.y + 38;
        const mid = (x1 + x2) / 2;
        path.setAttribute('d', `M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', 'rgba(124,156,255,.35)');
        path.setAttribute('stroke-width', '1.5');
        path.setAttribute('stroke-dasharray', '4 4');
        svg.append(path);
      }
    }
    box.append(svg);

    for (const leaf of leaves) {
      const pos = positions.get(leaf.id);
      const card = h('div', {
        class: 'cnode ' + (leaf.unlocked ? 'unlocked' : 'locked') + (app.selected.has(leaf.id) ? ' selected' : ''),
        title: leaf.name,
        onclick: e => {
          e.stopPropagation();
          if (e.ctrlKey || e.metaKey) toggleSelect(leaf.id);
          else openDrawer(leaf.id);
        },
      });
      card.style.left = pos.x + 'px';
      card.style.top = pos.y + 'px';
      card.append(h('span', { class: 'n-badge' }));
      card.append(h('div', { class: 'n-title', text: leaf.name }));
      const metaRow = h('div', { class: 'n-meta' });
      metaRow.append(h('span', { class: 'n-cost', text: `${leaf.cost} 点` }));
      if (leaf.prereqIds && leaf.prereqIds.length) metaRow.append(h('span', { text: `前置 ${leaf.prereqIds.length}` }));
      metaRow.append(h('span', { class: 'pill ' + (leaf.unlocked ? 'ok' : 'mutedp'), text: leaf.unlocked ? '已点亮' : '未点亮' }));
      card.append(metaRow);
      if (leaf.note) card.append(h('div', { class: 'n-note', text: leaf.note }));
      box.append(card);
    }

    layer.append(box);
    cursorY += height + 22;
    maxWidth = Math.max(maxWidth, width + 44);
  }
  if (!groups.length) {
    const empty = h('div', { class: 'empty', text: app.readOnly ? '对方还没有能力组。' : '还没有能力组，先从左侧「＋ 能力组」开始吧。' });
    empty.style.position = 'absolute';
    empty.style.left = '40px';
    empty.style.top = '80px';
    layer.append(empty);
  }
  layer.style.width = maxWidth + 'px';
  layer.style.height = Math.max(cursorY, 300) + 'px';
  applyTransform();
  renderMultiBar();
  if (!app.fitted && groups.length) {
    app.fitted = true;
    setTimeout(fitView, 20);
  }
}

function applyTransform() {
  const layer = $('#canvasLayer');
  if (!layer) return;
  layer.style.transform = `translate(${app.transform.x}px, ${app.transform.y}px) scale(${app.transform.scale})`;
}

function fitView() {
  const wrap = $('#canvasWrap');
  const layer = $('#canvasLayer');
  if (!wrap || !layer) return;
  const w = layer.offsetWidth || 600;
  const h = layer.offsetHeight || 400;
  const barH = ($('#canvasToolbar')?.offsetHeight || 36) + 16;
  const vw = wrap.clientWidth - 40;
  const availH = Math.max(160, wrap.clientHeight - barH - 16);
  const scale = Math.max(0.25, Math.min(1.15, vw / w, availH / h));
  app.transform.scale = scale;
  app.transform.x = Math.max(16, (wrap.clientWidth - w * scale) / 2);
  app.transform.y = barH + Math.max(4, (availH - h * scale) / 2);
  applyTransform();
}

function toggleSelect(id) {
  if (app.selected.has(id)) app.selected.delete(id);
  else app.selected.add(id);
  renderCanvas();
  if (findNode(id) && app.drawerId) renderDrawer();
}

function renderMultiBar() {
  const bar = $('#multiBar');
  if (!bar) return;
  bar.hidden = app.selected.size === 0;
  if (!app.selected.size) return;
  bar.replaceChildren(
    h('span', { text: `已选 ${app.selected.size} 个` }),
    h('button', { class: 'danger mini', type: 'button', text: '删除所选', onclick: deleteSelected }),
    h('button', { class: 'ghost mini', type: 'button', text: '取消', onclick: () => { app.selected.clear(); renderCanvas(); } })
  );
}

async function deleteSelected() {
  if (app.readOnly) return;
  if (!(await confirmDialog(`删除选中的 ${app.selected.size} 个节点？其子知识点和前置引用也会一并清理。`, '删除'))) return;
  const ids = new Set(app.selected);
  for (const node of app.tree.abilities) if (node.kind === 'group' && ids.has(node.id)) ids.add(node.id);
  app.tree.abilities = app.tree.abilities.filter(a => {
    if (a.kind === 'leaf' && ids.has(a.parentId)) return false;
    return !ids.has(a.id);
  });
  for (const a of app.tree.abilities) a.prereqIds = (a.prereqIds || []).filter(id => !ids.has(id));
  app.selected.clear();
  app.drawerId = null;
  const ok = await persistTree();
  if (ok) toast('已删除', 'ok');
}

// 平移与缩放
function bindCanvas() {
  const wrap = $('#canvasWrap');
  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;
    const old = app.transform;
    const scale = Math.max(0.25, Math.min(2.4, old.scale * Math.exp(-e.deltaY * 0.0015)));
    const k = scale / old.scale;
    app.transform = { scale, x: sx - (sx - old.x) * k, y: sy - (sy - old.y) * k };
    applyTransform();
  }, { passive: false });

  wrap.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    if (e.target.closest('.cnode, .cgroup-head, .multi-bar, .canvas-toolbar, .visitor-banner')) return;
    app.pan = { startX: e.clientX, startY: e.clientY, x: app.transform.x, y: app.transform.y, moved: false };
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', e => {
    if (!app.pan) return;
    const dx = e.clientX - app.pan.startX;
    const dy = e.clientY - app.pan.startY;
    if (Math.abs(dx) + Math.abs(dy) > 3) app.pan.moved = true;
    app.transform.x = app.pan.x + dx;
    app.transform.y = app.pan.y + dy;
    applyTransform();
  });
  wrap.addEventListener('pointerup', e => {
    const pan = app.pan;
    app.pan = null;
    if (pan && !pan.moved && app.selected.size) {
      app.selected.clear();
      renderCanvas();
    }
  });
  wrap.addEventListener('pointercancel', () => { app.pan = null; });
}

function renderToolbar() {
  const bar = $('#canvasToolbar');
  if (!bar) return;
  bar.replaceChildren();
  if (!app.readOnly) {
    bar.append(h('button', { class: 'primary', type: 'button', text: '＋ 能力组', onclick: () => openNodeModal('group') }));
    bar.append(h('button', { type: 'button', text: '＋ 知识点', onclick: () => openNodeModal('leaf') }));
    bar.append(h('button', { type: 'button', text: '＋ 已掌握', onclick: () => openNodeModal('leaf', { mastered: true }) }));
    bar.append(h('button', { type: 'button', text: '整理无效节点', onclick: pruneTree }));
  }
  bar.append(h('span', { class: 'grow' }));
  bar.append(h('button', { class: 'mini', type: 'button', text: '−', title: '缩小', onclick: () => zoomBy(0.85) }));
  bar.append(h('button', { class: 'mini', type: 'button', text: '+', title: '放大', onclick: () => zoomBy(1.18) }));
  bar.append(h('button', { class: 'mini', type: 'button', text: '适配', title: '自适应视图', onclick: fitView }));
}

function zoomBy(k) {
  const wrap = $('#canvasWrap');
  const sx = wrap.clientWidth / 2;
  const sy = wrap.clientHeight / 2;
  const old = app.transform;
  const scale = Math.max(0.25, Math.min(2.4, old.scale * k));
  const ratio = scale / old.scale;
  app.transform = { scale, x: sx - (sx - old.x) * ratio, y: sy - (sy - old.y) * ratio };
  applyTransform();
}

async function pruneTree() {
  if (app.readOnly) return;
  try {
    const data = await api('/api/prune', { method: 'POST', body: '{}' });
    app.tree = data.tree;
    app.meta = data.meta;
    toast(data.removed ? `已清理 ${data.removed} 个无效节点` : '没有发现无效节点', 'ok');
    renderTreeAll();
    updateHeader();
  } catch (e) { handleApiError(e); }
}

function openDrawer(id) {
  const node = findNode(id);
  if (!node) return;
  app.drawerId = id;
  app.selected.clear();
  renderCanvas();
  renderDrawer();
}

function closeDrawer() {
  app.drawerId = null;
  $('#drawer').hidden = true;
  $('#treeView').classList.remove('drawer-open');
}

function renderDrawer() {
  const drawer = $('#drawer');
  if (!drawer) return;
  if (!app.drawerId) { drawer.hidden = true; $('#treeView').classList.remove('drawer-open'); return; }
  const node = findNode(app.drawerId);
  if (!node) { app.drawerId = null; drawer.hidden = true; $('#treeView').classList.remove('drawer-open'); return; }
  drawer.hidden = false;
  $('#treeView').classList.add('drawer-open');
  drawer.replaceChildren();

  const group = groupOf(node);
  const cat = node.kind === 'group' ? app.tree.categories.find(c => c.id === node.categoryId) : null;
  const head = h('div', { class: 'drawer-head' },
    h('div', {},
      h('div', { class: 'drawer-title', text: node.name }),
      h('div', { class: 'drawer-sub', text: node.kind === 'group' ? `能力组 · Σ ${groupCost(node)} 点 · ${cat ? cat.name : '未分类'}` : `知识点 · ${node.cost} 点 · ${node.unlocked ? '已点亮' : '未点亮'}` })
    ),

  );
  drawer.append(head);

  if (app.readOnly) {
    drawer.append(h('div', { class: 'hint-line', text: '访客模式：只读查看，不能修改对方的内容。' }));
    drawer.append(h('div', { class: 'hr' }));
    drawer.append(h('div', { class: 'kv' },
      h('span', { class: 'k', text: '节点类型' }), h('span', { class: 'v', text: node.kind === 'group' ? '能力组' : '知识点' }),
      h('span', { class: 'k', text: '成本' }), h('span', { class: 'v mono', text: String(node.cost) }),
      h('span', { class: 'k', text: '状态' }), h('span', { class: 'v', text: node.unlocked ? '已点亮' : '未点亮' })
    ));
    if (node.prereqIds && node.prereqIds.length) {
      drawer.append(h('label', { text: '前置知识点' }));
      const chips = h('div', { class: 'chips' });
      for (const pid of node.prereqIds) {
        const pre = findNode(pid);

      }
      drawer.append(chips);
    }
    if (node.note) { drawer.append(h('label', { text: '学习记录' })); drawer.append(h('div', { class: 'hint-line', text: node.note })); }
    if (node.photos && node.photos.length) {
      drawer.append(h('label', { text: '照片' }));
      const grid = h('div', { class: 'photo-grid' });
      for (const p of node.photos) grid.append(h('div', { class: 'photo-item' }, h('img', { src: `/api/photos/${encodeURIComponent(p.storedAs)}`, alt: p.name, loading: 'lazy' })));
      drawer.append(grid);
    }
    if (node.kind === 'group') {
      const leaves = app.tree.abilities.filter(a => a.kind === 'leaf' && a.parentId === node.id);
      drawer.append(h('label', { text: `包含知识点（${leaves.length}）` }));
      const chips = h('div', { class: 'chips' });
      for (const leaf of leaves) chips.append(h('span', { class: 'chip' + (leaf.unlocked ? ' on' : ''), text: `${leaf.name} · ${leaf.cost}` }));
      drawer.append(chips);
    }
    return;
  }

  const form = h('form', {});
  form.append(h('label', { text: '名称' }));

  form.append(nameInput);

  let costInput = null;
  let catSelect = null;
  if (node.kind === 'leaf') {
    form.append(h('label', { text: '成本（科技点）' }));
    costInput = h('input', { type: 'number', min: 1, max: 100000, step: 1, value: node.cost, required: true });
    form.append(costInput);
  } else {
    const total = groupCost(node);
    form.append(h('div', { class: 'hint-line', text: `能力组成本自动等于其下知识点成本之和：Σ ${total}` }));
    form.append(h('label', { text: '所属分类' }));
    catSelect = h('select', {});
    for (const c of app.tree.categories) catSelect.append(h('option', { value: c.id, text: c.name, selected: c.id === node.categoryId }));
    form.append(catSelect);
  }

  const prereqSet = new Set(node.prereqIds || []);

            prereqSet.add(s.id);
          }
          chip.classList.toggle('on', prereqSet.has(s.id));
        });
        chips.append(chip);
      }
      form.append(chips);
    }
  }

  form.append(h('label', { text: '学习记录' }));
  const noteInput = h('textarea', { maxlength: 5000, placeholder: '记录你的学习过程、资料链接或心得…' });
