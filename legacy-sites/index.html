<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="一个极简的个人科技树：科技点和能力保存在云端，使用同一账号即可跨设备同步。">
<title>科技树</title>
<style>
  :root {
    --site-bg: #f6f7f9;
    --site-fg: #1f2430;
    --site-muted: #6b7280;
    --site-border: #e5e7eb;
    --site-surface: #ffffff;
    --site-accent: #2563eb;
    --site-on-accent: #ffffff;
    --site-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --site-radius: 10px;
    --site-space: 1;
    --site-type: 1;
    --ok: #059669;
    --warn: #b45309;
    --danger: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--site-bg);
    color: var(--site-fg);
    font-family: var(--site-font);
    font-size: calc(16px * var(--site-type, 1));
    line-height: 1.5;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--site-surface);
    border-bottom: 1px solid var(--site-border);
    padding: calc(12px * var(--site-space, 1)) calc(16px * var(--site-space, 1));
  }
  .bar {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: calc(12px * var(--site-space, 1));
  }
  .bar h1 { font-size: calc(16px * var(--site-type, 1)); font-weight: 600; margin: 0; }
  .balance { font-size: calc(14px * var(--site-type, 1)); color: var(--site-muted); white-space: nowrap; }
  .balance strong {
    margin-left: calc(6px * var(--site-space, 1));
    font-size: calc(22px * var(--site-type, 1));
    color: var(--site-accent);
    font-variant-numeric: tabular-nums;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: calc(16px * var(--site-space, 1));
  }
  .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(12px * var(--site-space, 1));
    padding: calc(28px * var(--site-space, 1)) calc(20px * var(--site-space, 1));
    text-align: center;
    background: var(--site-surface);
    border: 1px solid var(--site-border);
    border-radius: var(--site-radius);
  }
  .panel p { margin: 0; font-size: calc(14px * var(--site-type, 1)); color: var(--site-muted); }
  .link-btn { display: inline-block; text-decoration: none; }
  .add {
    background: var(--site-surface);
    border: 1px solid var(--site-border);
    border-radius: var(--site-radius);
    padding: calc(14px * var(--site-space, 1));
    display: flex;
    flex-wrap: wrap;
    gap: calc(10px * var(--site-space, 1));
    align-items: flex-end;
  }
  .field { display: flex; flex-direction: column; gap: calc(4px * var(--site-space, 1)); flex: 1 1 160px; min-width: 0; }
  .field.cost { flex: 0 1 130px; }
  .field label { font-size: calc(12px * var(--site-type, 1)); color: var(--site-muted); }
  input {
    width: 100%;
    font: inherit;
    padding: calc(8px * var(--site-space, 1)) calc(10px * var(--site-space, 1));
    border: 1px solid var(--site-border);
    border-radius: var(--site-radius);
    background: var(--site-surface);
    color: inherit;
  }
  input:focus {
    outline: 2px solid color-mix(in srgb, var(--site-accent) 30%, var(--site-surface));
    border-color: var(--site-accent);
  }
  input:disabled { background: color-mix(in srgb, var(--site-muted) 6%, var(--site-surface)); }
  button { font: inherit; cursor: pointer; }
  .btn-primary {
    padding: calc(9px * var(--site-space, 1)) calc(16px * var(--site-space, 1));
    border: 1px solid var(--site-accent);
    border-radius: var(--site-radius);
    background: var(--site-accent);
    color: var(--site-on-accent);
  }
  .btn-primary:hover:not(:disabled) {
    background: #1d4ed8;
    background: color-mix(in srgb, var(--site-accent) 85%, #000);
    border-color: color-mix(in srgb, var(--site-accent) 85%, #000);
  }
  .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
  .form-error {
    flex-basis: 100%;
    margin: 0;
    font-size: calc(13px * var(--site-type, 1));
    color: var(--danger);
  }
  .notice {
    margin: calc(12px * var(--site-space, 1)) 0 0;
    padding: calc(8px * var(--site-space, 1)) calc(12px * var(--site-space, 1));
    font-size: calc(13px * var(--site-type, 1));
    border-radius: var(--site-radius);
  }
  .notice.ok { color: var(--ok); background: #ecfdf5; border: 1px solid #a7f3d0; }
  .notice.warn { color: var(--warn); background: #fffbeb; border: 1px solid #fde68a; }
  .notice.error { color: var(--danger); background: #fef2f2; border: 1px solid #fecaca; }
  .skills {
    list-style: none;
    margin: calc(16px * var(--site-space, 1)) 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: calc(10px * var(--site-space, 1));
  }
  .skill {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: calc(10px * var(--site-space, 1));
    background: var(--site-surface);
    border: 1px solid var(--site-border);
    border-radius: var(--site-radius);
    padding: calc(12px * var(--site-space, 1)) calc(14px * var(--site-space, 1));
  }
  .skill .name { flex: 1 1 140px; font-weight: 600; word-break: break-word; }
  .skill .cost { font-size: calc(13px * var(--site-type, 1)); color: var(--site-muted); white-space: nowrap; }
  .tag {
    font-size: calc(12px * var(--site-type, 1));
    padding: calc(2px * var(--site-space, 1)) calc(8px * var(--site-space, 1));
    border-radius: 999px;
    border: 1px solid var(--site-border);
    color: var(--site-muted);
    white-space: nowrap;
  }
  .tag.lit { color: var(--ok); background: #ecfdf5; border-color: #a7f3d0; }
  .actions {
    display: flex;
    align-items: center;
    gap: calc(8px * var(--site-space, 1));
    margin-left: auto;
  }
  .btn-light {
    padding: calc(6px * var(--site-space, 1)) calc(14px * var(--site-space, 1));
    border: 1px solid #bfdbfe;
    border: 1px solid color-mix(in srgb, var(--site-accent) 30%, var(--site-surface));
    border-radius: var(--site-radius);
    background: #eff6ff;
    background: color-mix(in srgb, var(--site-accent) 8%, var(--site-surface));
    color: var(--site-accent);
  }
  .btn-light:hover:not(:disabled) {
    background: #dbeafe;
    background: color-mix(in srgb, var(--site-accent) 16%, var(--site-surface));
  }
  .btn-light:disabled {
    background: color-mix(in srgb, var(--site-muted) 8%, var(--site-surface));
    border-color: var(--site-border);
    color: var(--site-muted);
    opacity: .7;
    cursor: not-allowed;
  }
  .hint { font-size: calc(12px * var(--site-type, 1)); color: var(--warn); white-space: nowrap; }
  .empty {
    margin-top: calc(16px * var(--site-space, 1));
    padding: calc(24px * var(--site-space, 1));
    text-align: center;
    font-size: calc(14px * var(--site-type, 1));
    color: var(--site-muted);
    background: var(--site-surface);
    border: 1px dashed var(--site-border);
    border-radius: var(--site-radius);
  }
  .footnote {
    margin: calc(20px * var(--site-space, 1)) 0 0;
    text-align: center;
    font-size: calc(12px * var(--site-type, 1));
    color: var(--site-muted);
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>科技树</h1>
    <div class="balance">科技点<strong id="points">—</strong></div>
  </div>
</header>

<main>
  <section class="panel" id="panel" hidden>
    <p id="panel-text"></p>
    <a class="btn-primary link-btn" id="panel-login" hidden>登录 Qoder 账号</a>
    <button class="btn-primary" id="panel-retry" type="button" hidden>重试</button>
  </section>

  <div id="workspace" hidden>
    <form class="add" id="add-form" novalidate>
      <div class="field">
        <label for="name">能力名称</label>
        <input id="name" maxlength="30" autocomplete="off" placeholder="例如 JavaScript">
      </div>
      <div class="field cost">
        <label for="cost">成本（正整数）</label>
        <input id="cost" type="number" min="1" step="1" inputmode="numeric" placeholder="例如 3">
      </div>
      <button class="btn-primary" id="add-btn" type="submit">添加能力</button>
      <p class="form-error" id="form-error" role="alert" hidden></p>
    </form>

    <p class="notice" id="notice" role="status" hidden></p>

    <ul class="skills" id="skill-list"></ul>
    <p class="empty" id="empty" hidden>还没有能力，先在上方添加一个吧。</p>
  </div>

  <p class="footnote">数据保存在云端，登录同一 Qoder 账号即可跨设备同步。</p>
</main>

<script>
  const API = '/functions/v1/app';
  const AUTH_START = '/__qoder_auth/start?return_path=';

  const MESSAGES = {
    insufficient_points: '科技点不足，已刷新最新状态。',
    invalid_input: '输入不合法：名称 1–30 个字符，成本为正整数。',
    too_many_skills: '能力数量已达上限（200 个）。',
    skill_not_found: '这个能力已不存在，已刷新最新状态。',
    write_rejected: '保存被云端拒绝，已刷新最新状态。',
    write_result_unknown: '网络异常，上次保存结果未知。',
    network_error: '网络连接失败，请检查网络后重试。',
    invalid_response: '服务返回了异常响应，请稍后重试。',
    access_denied: '需要登录后使用。',
    state_unavailable: '云端数据暂时不可用，请稍后重试。',
    service_unavailable: '服务暂时不可用，请稍后重试。',
  };

  class ApiError extends Error {
    constructor(code, status) {
      super(code);
      this.code = code;
      this.status = status;
    }
  }

  const pointsEl = document.getElementById('points');
  const panelEl = document.getElementById('panel');
  const panelTextEl = document.getElementById('panel-text');
  const panelLoginEl = document.getElementById('panel-login');
  const panelRetryEl = document.getElementById('panel-retry');
  const workspaceEl = document.getElementById('workspace');
  const formEl = document.getElementById('add-form');
  const nameEl = document.getElementById('name');
  const costEl = document.getElementById('cost');
  const addBtnEl = document.getElementById('add-btn');
  const errorEl = document.getElementById('form-error');
  const noticeEl = document.getElementById('notice');
  const listEl = document.getElementById('skill-list');
  const emptyEl = document.getElementById('empty');

  let state = null;
  let view = 'loading';
  let busy = false;
  let notice = null;

  const messageFor = (code) => MESSAGES[code] || '请求失败，请稍后重试。';

  async function requestJson(url, init = {}) {
    const headers = new Headers(init.headers);
    headers.set('Accept', 'application/json');
    let response;
    try {
      response = await fetch(url, { ...init, headers, credentials: 'same-origin' });
    } catch (error) {
      throw new ApiError('network_error', 0);
    }
    if (response.status === 401 || response.status === 403) {
      throw new ApiError('access_denied', response.status);
    }
    if (response.redirected || !response.headers.get('content-type')?.includes('application/json')) {
      throw new ApiError('invalid_response', response.status);
    }
    let data;
    try {
      data = await response.json();
    } catch (error) {
      throw new ApiError('invalid_response', response.status);
    }
    const body = data && typeof data === 'object' ? data : null;
    const code = typeof body?.error === 'string' ? body.error : (response.ok ? null : 'request_failed');
    if (!response.ok || code) throw new ApiError(code, response.status);
    return data;
  }

  function parseState(data) {
    const source = data?.state;
    if (!source || !Number.isInteger(source.points) || source.points < 0 || !Array.isArray(source.skills)) {
      throw new ApiError('invalid_response', 0);
    }
    const skills = source.skills.map((s) => {
      if (!s || typeof s.id !== 'string' || typeof s.name !== 'string' || !s.name
          || !Number.isInteger(s.cost) || s.cost < 1 || typeof s.lit !== 'boolean') {
        throw new ApiError('invalid_response', 0);
      }
      return { id: s.id, name: s.name, cost: s.cost, lit: s.lit };
    });
    return { points: source.points, skills };
  }

  function isUnknownOutcome(error) {
    if (!(error instanceof ApiError)) return true;
    if (error.code === 'access_denied') return false;
    if (['insufficient_points', 'invalid_input', 'too_many_skills', 'skill_not_found', 'write_rejected'].includes(error.code)) {
      return false;
    }
    return ['network_error', 'invalid_response', 'write_result_unknown', 'service_unavailable', 'state_unavailable'].includes(error.code)
      || (error.status >= 500 && error.status < 600);
  }

  function showNotice(type, text) {
    notice = text ? { type, text } : null;
  }

  function render() {
    pointsEl.textContent = state ? String(state.points) : '—';

    const ready = view === 'ready';
    panelEl.hidden = ready;
    workspaceEl.hidden = !ready;

    if (!ready) {
      const text = view === 'loading' ? '正在从云端加载…'
        : view === 'auth' ? '请先登录 Qoder 账号，登录后数据会按账号保存。'
        : '加载失败：' + (panelTextEl.dataset.message || '');
      panelTextEl.textContent = text;
      panelLoginEl.hidden = view !== 'auth';
      panelRetryEl.hidden = view !== 'error';
      if (view === 'auth') {
        panelLoginEl.href = AUTH_START + encodeURIComponent(location.pathname + location.search);
      }
      listEl.replaceChildren();
      emptyEl.hidden = true;
      noticeEl.hidden = true;
      return;
    }

    panelTextEl.removeAttribute('data-message');
    nameEl.disabled = busy;
    costEl.disabled = busy;
    addBtnEl.disabled = busy;
    addBtnEl.textContent = busy ? '处理中…' : '添加能力';

    listEl.replaceChildren();
    if (state) {
      for (const skill of state.skills) listEl.appendChild(skillItem(skill));
    }
    emptyEl.hidden = !state || state.skills.length > 0;

    if (notice) {
      noticeEl.textContent = notice.text;
      noticeEl.className = 'notice ' + notice.type;
      noticeEl.hidden = false;
    } else {
      noticeEl.hidden = true;
    }
  }

  function skillItem(skill) {
    const li = document.createElement('li');
    li.className = 'skill';

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = skill.name;

    const cost = document.createElement('span');
    cost.className = 'cost';
    cost.textContent = '成本 ' + skill.cost;

    const actions = document.createElement('div');
    actions.className = 'actions';

    if (skill.lit) {
      const tag = document.createElement('span');
      tag.className = 'tag lit';
      tag.textContent = '已点亮';
      actions.appendChild(tag);
    } else {
      const affordable = state.points >= skill.cost;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-light';
      btn.textContent = '点亮';
      btn.disabled = busy || !affordable;
      if (!affordable) {
        btn.title = '科技点不足';
        const hint = document.createElement('span');
        hint.className = 'hint';
        hint.textContent = '点数不足，还差 ' + (skill.cost - state.points);
        actions.appendChild(hint);
      } else if (!busy) {
        btn.addEventListener('click', () => lightUp(skill.id));
      }
      actions.appendChild(btn);
    }

    li.append(name, cost, actions);
    return li;
  }

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.hidden = false;
  }

  function clearError() {
    errorEl.hidden = true;
    errorEl.textContent = '';
  }

  async function loadState() {
    view = 'loading';
    render();
    try {
      const data = await requestJson(API + '?action=state');
      state = parseState(data);
      view = 'ready';
    } catch (error) {
      state = null;
      if (error instanceof ApiError && error.code === 'access_denied') {
        view = 'auth';
      } else {
        view = 'error';
        panelTextEl.dataset.message = messageFor(error instanceof ApiError ? error.code : 'request_failed');
      }
    }
    render();
  }

  async function runWrite(request) {
    if (busy) return null;
    busy = true;
    showNotice('', '');
    clearError();
    render();
    try {
      const data = await request();
      return parseState(data);
    } catch (error) {
      if (error instanceof ApiError && error.code === 'access_denied') {
        state = null;
        view = 'auth';
        busy = false;
        render();
        return null;
      }
      busy = false;
      if (isUnknownOutcome(error)) {
        await loadState();
        showNotice('warn', '上次操作结果未知，已重新读取云端数据，请确认当前状态。');
        render();
        return null;
      }
      const code = error instanceof ApiError ? error.code : 'request_failed';
      showNotice('error', messageFor(code));
      busy = false;
      render();
      if (['insufficient_points', 'skill_not_found', 'write_rejected'].includes(code)) {
        await loadState();
        showNotice('error', messageFor(code));
        render();
      }
      return null;
    }
  }

  async function addSkill(name, cost) {
    const next = await runWrite(() => requestJson(API + '?action=skills', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, cost }),
    }));
    busy = false;
    if (next) {
      state = next;
      formEl.reset();
      showNotice('ok', '已保存到云端。');
      render();
      nameEl.focus();
    }
  }

  async function lightUp(id) {
    const next = await runWrite(() => requestJson(API + '?action=light', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id }),
    }));
    busy = false;
    if (next) {
      state = next;
      showNotice('ok', '已点亮并保存到云端。');
      render();
    }
  }

  formEl.addEventListener('submit', (event) => {
    event.preventDefault();
    if (busy || view !== 'ready') return;
    clearError();

    const name = nameEl.value.trim();
    const cost = Number(costEl.value);

    if (!name) {
      showError('请填写能力名称。');
      nameEl.focus();
      return;
    }
    if (!Number.isInteger(cost) || cost < 1) {
      showError('成本必须是正整数。');
      costEl.focus();
      return;
    }
    addSkill(name, cost);
  });

  panelRetryEl.addEventListener('click', () => {
    showNotice('', '');
    loadState();
  });

  loadState();
</script>
</body>
</html>
